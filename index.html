<!doctype html><html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>P:F</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17131f">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="P:F">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{--bg:#17131f;--surf:#221c2d;--surf2:#2c2439;--line:#332b42;
    --text:#eae4dd;--dim:#8d84a0;--amber:#e0a458;--gold:#f3d29a;--sage:#7fa88b;--red:#c97b7b;
    --c-routine:#e0a458;--c-wish:#c471a5;--c-needed:#46c48c;--c-maybe:#8f9ad6}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg)}
  body{margin:0;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:calc(18px + env(safe-area-inset-top)) 18px calc(90px + env(safe-area-inset-bottom));
    max-width:560px;margin:0 auto;overscroll-behavior-y:contain}
  h1{font:500 15px/1 system-ui;letter-spacing:.14em;color:var(--dim);margin:0}
  h2{font:400 20px Georgia,serif;margin:0 0 2px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:10px}
  .count{font:300 68px/.8 Georgia,serif}
  .gap{font-size:13px;padding-bottom:6px;color:var(--dim);transition:color .4s}
  .bars{display:flex;gap:4px;margin-top:16px}
  .bar{height:6px;flex:1;min-width:3px;border-radius:3px;background:var(--line);
    transition:background .45s,box-shadow .45s,transform .25s}
  .bar.on{background:var(--amber);box-shadow:0 0 12px #e0a45866}
  .mixbar{display:flex;gap:2px;margin-top:8px;height:9px}
  .mixbar i{display:block;border-radius:3px;transition:flex-grow .6s ease,background .6s ease}
  .mixlab{font-size:11px;color:var(--dim);margin-top:7px;display:flex;gap:12px;flex-wrap:wrap}
  .mixlab s{text-decoration:none;display:flex;align-items:center;gap:5px}
  .mixlab b{width:8px;height:8px;border-radius:50%;display:inline-block}
  @keyframes wave{0%,100%{transform:scaleY(1)}50%{transform:scaleY(2.8)}}
  .cheer .bar{animation:wave .55s ease}
  .cheer .bar:nth-child(2){animation-delay:.05s}.cheer .bar:nth-child(3){animation-delay:.1s}
  .cheer .bar:nth-child(4){animation-delay:.15s}.cheer .bar:nth-child(5){animation-delay:.2s}
  .cheer .bar:nth-child(6){animation-delay:.25s}.cheer .bar:nth-child(7){animation-delay:.3s}
  .week{display:flex;gap:6px;margin-top:20px;align-items:flex-end}
  .wk{flex:1;text-align:center}
  .wk i{display:block;border-radius:2px;background:var(--line);transition:height .4s}
  .wk span{font-size:10px;color:var(--dim);display:block;margin-top:5px}
  .lvl{margin-top:22px;display:flex;align-items:center;gap:10px}
  .lvlbar{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
  .lvlbar i{display:block;height:100%;background:var(--sage);transition:width .5s ease}
  .lvltext{font-size:11px;color:var(--dim);white-space:nowrap}
  section{margin-top:30px}
  .row{--acc:var(--amber);position:relative;display:flex;align-items:center;gap:12px;background:var(--surf);
    border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:7px;
    transition:transform .16s,border-color .2s,background .2s}
  .row.c-routine{--acc:var(--c-routine)} .row.c-wish{--acc:var(--c-wish)}
  .row.c-needed{--acc:var(--c-needed)}  .row.c-maybe{--acc:var(--c-maybe)}
  .row.done{border-color:transparent}
  .row.soon{border-color:#e0a45855}
  .row.late{border-color:#c97b7b66}
  .row.moving{border-color:var(--amber);background:var(--surf2);box-shadow:0 8px 26px #0009;touch-action:none;z-index:40}
  .row.lifting{transition:none;z-index:50}
  .fx{position:absolute;inset:0;border-radius:10px;overflow:hidden;pointer-events:none}
  .fx::before{content:"";position:absolute;inset:0;transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,var(--acc),transparent);opacity:.42}
  @keyframes sweep{to{transform:translateX(100%)}}
  .row.hit .fx::before{animation:sweep .55s ease}
  .dot{width:24px;height:24px;flex:0 0 auto;border-radius:50%;border:2px solid var(--line);
    background:none;padding:0;cursor:pointer;position:relative}
  .dot.on{background:var(--acc);border-color:var(--acc)}
  @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.55)}100%{transform:scale(1)}}
  @keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
  .dot.pop{animation:pop .45s ease}
  .dot.pop::before{content:"";position:absolute;inset:-2px;border-radius:50%;
    border:2px solid var(--acc);animation:ring .55s ease-out forwards}
  .txt{flex:1;font-size:16px;cursor:pointer;word-break:break-word}
  .txt.done{color:var(--dim);text-decoration:line-through}
  .when{font-size:11px;color:var(--dim);white-space:nowrap;flex:0 0 auto}
  .when.soon{color:var(--amber)}.when.late{color:var(--red)}
  .more{background:none;border:none;color:var(--dim);font-size:19px;line-height:1;padding:6px 2px;cursor:pointer}
  .grip{color:var(--amber);font-size:19px;padding:6px 4px;touch-action:none;cursor:grab;user-select:none}
  .menu{position:absolute;top:calc(100% + 6px);right:6px;z-index:60;background:var(--surf2);
    border:1px solid var(--line);border-radius:12px;padding:6px;min-width:212px;box-shadow:0 10px 30px #000a}
  .menu button{display:block;width:100%;text-align:left;background:none;border:none;
    color:var(--text);font-size:15px;padding:11px 12px;border-radius:8px;cursor:pointer}
  .menu .lab{color:var(--dim);font-size:11px;padding:4px 12px 6px}
  .menu hr{border:none;border-top:1px solid var(--line);margin:5px 8px}
  .duebox{background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:7px}
  .duebox div{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;color:var(--dim)}
  .duebox input,.duebox select{background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:9px 10px;color:var(--text);font-size:15px;flex:1;font-family:inherit}
  .duebox .acts{display:flex;gap:8px;margin:0}
  .addbtn{background:none;border:1px dashed var(--line);border-radius:10px;padding:11px 14px;
    color:var(--dim);font-size:14px;width:100%;text-align:left;cursor:pointer;margin-top:4px}
  .addrow{display:flex;gap:8px;margin-top:8px}
  input{flex:1;background:var(--surf);border:1px solid var(--line);border-radius:10px;
    padding:13px 14px;color:var(--text);font-size:16px}
  .ok{background:var(--amber);border:none;border-radius:10px;padding:0 18px;color:var(--bg);font-size:15px;cursor:pointer}
  .ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:9px 14px;color:var(--dim);font-size:14px;cursor:pointer}
  .empty{color:var(--dim);font-size:13px;padding:6px 0}
  .closed{color:var(--dim);font-size:12px;margin-top:6px}
  .closed div{margin-top:7px;display:flex;gap:10px;align-items:center}
  .closed b{color:var(--sage);font-weight:400;cursor:pointer}
  .scrim{position:fixed;inset:0;z-index:55}
  .donebar{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--amber);color:var(--bg);
    border:none;width:100%;padding:18px calc(18px + env(safe-area-inset-bottom));font-size:16px;cursor:pointer}
  .gear{background:none;border:none;color:var(--dim);font-size:16px;cursor:pointer;padding:4px}
  .panel{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px}
  .panel label{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:7px 0}
  .panel .note{color:var(--dim);font-size:11px;margin-top:6px;line-height:1.5}
  .sw{width:44px;height:26px;border-radius:14px;background:var(--line);border:none;position:relative;cursor:pointer;flex:0 0 auto}
  .sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:.2s}
  .sw.on{background:#4a3c2a}.sw.on i{left:21px;background:var(--amber)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"></div>
<script>
const CATS=[
 {id:"routine",title:"Рутина",sub:"каждый день",daily:true},
 {id:"wish",title:"Желательное",sub:"хотелось бы, но не обязан",daily:true},
 {id:"needed",title:"Нужно сделать",sub:"без даты",daily:false},
 {id:"maybe",title:"Можно сделать",sub:"если захочется",daily:false}];
const KEY="routine_v1";

let S={items:[],log:{},total:0,snd:true,vib:true,vol:1};
let menuFor=null,moveFor=null,renaming=null,adding=null,dueFor=null,openClosed={},
    pulse=null,cheerRank=0,settings=false;

const ACC={routine:"#e0a458",wish:"#c471a5",needed:"#46c48c",maybe:"#8f9ad6"};
const WEIGHT={routine:1,wish:2.5,needed:5,maybe:1.5};   // вес = сколько это стоит

const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const toLin=v=>{v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)};
const toSrgb=v=>{const x=v<=.0031308?v*12.92:1.055*Math.pow(v,1/2.4)-.055;
  return Math.round(Math.max(0,Math.min(1,x))*255)};
function mix(parts){                      // [[hex,вес],...] -> "rgb(...)"
  const tot=parts.reduce((a,p)=>a+p[1],0); if(!tot)return null;
  const acc=[0,0,0];
  for(const [hex,w] of parts){const c=hex2rgb(hex);
    for(let i=0;i<3;i++)acc[i]+=toLin(c[i])*w/tot}
  return `rgb(${acc.map(toSrgb).join(",")})`;
}
function dayParts(){
  const t=today(),d=doneToday();
  const n={routine:byCat("routine").filter(r=>d.includes(r.id)).length,
           wish:byCat("wish").filter(w=>d.includes(w.id)).length,
           needed:S.items.filter(i=>i.cat==="needed"&&i.done&&i.doneAt===t).length,
           maybe:S.items.filter(i=>i.cat==="maybe"&&i.done&&i.doneAt===t).length};
  return Object.keys(n).filter(k=>n[k]).map(k=>({cat:k,n:n[k],w:n[k]*WEIGHT[k],c:ACC[k]}));
}
const dayColor=()=>{const p=dayParts();return p.length?mix(p.map(x=>[x.c,x.w])):null};

/* очки дня: тот же вес, что и у цвета */
function scoreOf(date){
  const ids=S.log[date]||[]; let sc=0;
  for(const id of ids){const it=S.items.find(x=>x.id===id); if(it)sc+=WEIGHT[it.cat]||1}
  for(const it of S.items)if(it.done&&it.doneAt===date)sc+=WEIGHT[it.cat]||1;
  return Math.round(sc*10)/10;
}
function best(exceptToday){
  const t=today(); let b={v:0,d:null};
  const dates=new Set([...Object.keys(S.log),...S.items.filter(i=>i.doneAt).map(i=>i.doneAt)]);
  for(const d of dates){ if(exceptToday&&d===t)continue;
    const v=scoreOf(d); if(v>b.v)b={v,d} }
  return b;
}

const uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const lab=s=>["вс","пн","вт","ср","чт","пт","сб"][new Date(s+"T12:00").getDay()];
const days=n=>{const o=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);o.push(iso(d))}return o};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const daysTo=due=>Math.round((new Date(due+"T12:00")-new Date(today()+"T12:00"))/864e5);

const store={
  async load(){
    try{if(window.storage){return JSON.parse((await window.storage.get(KEY)).value)}}catch(e){}
    try{const v=localStorage.getItem(KEY);if(v)return JSON.parse(v)}catch(e){}
    return null},
  save(){const d=JSON.stringify(S);
    try{if(window.storage)window.storage.set(KEY,d).catch(()=>{})}catch(e){}
    try{localStorage.setItem(KEY,d)}catch(e){}}
};

/* ---------- отклик ---------- */
let ac=null;
function tone(freqs,dur=.34,vol=.3,gap=.055,echo=true){
  if(!S.snd)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended")ac.resume();
    const out=ac.createGain(); out.gain.value=1; out.connect(ac.destination);
    const play=(f,t,v,d)=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.type="triangle";o.frequency.value=f;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(v,t+.015);
      g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g);g.connect(out);o.start(t);o.stop(t+d+.08);
    };
    freqs.forEach((f,i)=>{
      const t=ac.currentTime+i*gap;
      play(f,t,vol,dur);
      if(echo)play(f*2,t+.11,vol*.16,dur*.8);   // тихий верхний отзвук
    });
  }catch(e){}
}

function buzz(p){
  if(!S.vib)return false;
  try{return navigator.vibrate? navigator.vibrate(p) : false}catch(e){return false}
}

/* ---------- состояние ---------- */
const byCat=c=>S.items.filter(i=>i.cat===c);
const doneToday=()=>S.log[today()]||[];
const isDone=it=>CATS.find(c=>c.id===it.cat).daily?doneToday().includes(it.id):!!it.done;

function rank(){
  const t=today(),d=doneToday(),routine=byCat("routine");
  if(!routine.length||routine.some(r=>!d.includes(r.id)))return 0;
  const wish=byCat("wish").some(w=>d.includes(w.id));
  const need=S.items.some(i=>i.cat==="needed"&&i.done&&i.doneAt===t);
  return 1+(wish?1:0)+(need?2:0);   // 1 / 2 / 3 / 4
}
const RANKS={
 0:{t:"",s:[]},
 1:{t:"день закрыт",s:[523,659,784],v:[20,40,60]},
 2:{t:"день закрыт + желательное",s:[587,740,880,988],v:[20,40,20,40,70]},
 3:{t:"день закрыт + дело из банка",s:[523,622,784,932],v:[30,50,30,70]},
 4:{t:"полный день",s:[523,659,784,1047,1319],v:[20,40,20,40,20,90]}};
const NAMES={routine:"рутина",wish:"желательное",needed:"нужное",maybe:"можно"};

function toggle(id){
  const it=S.items.find(x=>x.id===id); if(!it||moveFor)return;
  const cat=CATS.find(c=>c.id===it.cat),t=today(),before=rank();
  const wasRecord=scoreOf(t)>best(true).v;
  if(cat.daily){
    const d=doneToday(),has=d.includes(id);
    S.log[t]=has?d.filter(x=>x!==id):[...d,id];
    if(!has){reward(id,before,wasRecord);store.save();return render()}
  }else{
    if(!it.done){
      pulse=id;S.total++;render();
      setTimeout(()=>{it.done=true;it.doneAt=t;pulse=null;
        sound(before,rank(),wasRecord);store.save();render();
        setTimeout(()=>{cheerRank=0;render()},700)},480);
      return;
    }
    it.done=false;delete it.doneAt;
  }
  store.save();render();
}

function reward(id,before,wasRecord){
  pulse=id;S.total++;
  sound(before,rank(),wasRecord);
  setTimeout(()=>{pulse=null;cheerRank=0;render()},700);
}

const SCALE=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.51,1567.98,1760,2093];

function sound(before,after,wasRecord){
  const t=today();
  const step=(S.log[t]||[]).length + S.items.filter(i=>i.done&&i.doneAt===t).length;

  // рутина закрылась целиком — единственное отдельное событие
  if(before<1&&after>=1){
    cheerRank=after;
    tone([392,523.25,659.25,783.99,1046.5],.5,.34*S.vol,.075);
    buzz([20,40,20,40,20,90]);
    return;
  }

  // обычная отметка: восходящее трезвучие, выше и плотнее с каждым делом за день
  const i=Math.min(step,SCALE.length-1), n=SCALE[i];
  const chord=[n,n*1.25,n*1.5];
  if(step>=5)chord.push(n*2);
  const vol=(.24+Math.min(step,10)*.014)*S.vol;
  tone(chord,.36+Math.min(step,8)*.012,vol,.055);
  buzz(30+Math.min(step,8)*3);

  // рекорд не перебивает звук дела, а добавляет отзвук сверху
  const rec=best(true).v;
  if(!wasRecord&&rec>0&&scoreOf(t)>rec){
    cheerRank=4;
    setTimeout(()=>tone([n*2,n*2.5,n*3],.5,.2*S.vol,.07),240);
    buzz([25,35,25,35,25,110]);
  }
}

/* ---------- отрисовка ---------- */
function dueMeta(it){
  if(!it.due||it.done)return null;
  const n=daysTo(it.due);
  const warn=it.warn===undefined?3:it.warn;
  const txt=n<0?`просрочено на ${-n} дн.`:n===0?"сегодня":n===1?"завтра":`через ${n} дн.`;
  return {n,txt,show:n<=warn,cls:n<0?"late":n<=1?"soon":""};
}

function render(){
  const t=today(),d=doneToday(),routine=byCat("routine");
  const doneR=routine.filter(r=>d.includes(r.id)).length,left=routine.length-doneR;
  const sc=scoreOf(t),bst=best(true),isRec=sc>bst.v&&bst.v>0;
  const rk=rank();

  let h=`<div style="display:flex;align-items:center;justify-content:space-between">
    <h1>${lab(t)}</h1><button class="gear" data-gear="1">${settings?"✕":"⚙"}</button></div>`;
  if(settings)h+=`<div class="panel">
      <label>Звук отметки<button class="sw ${S.snd?"on":""}" data-t="snd"><i></i></button></label>
      <label>Громче<button class="sw ${S.vol>1?"on":""}" data-t="vol"><i></i></button></label>
      <label>Вибрация<button class="sw ${S.vib?"on":""}" data-t="vib"><i></i></button></label>
      <div class="acts" style="display:flex;gap:8px;margin-top:6px">
        <button class="ghost" data-vibtest="1">Проверить вибрацию</button></div>
      <div class="note" id="vibnote">Сегодня ${scoreOf(t)} оч. · рекорд ${best(false).v} оч.</div></div>`;

  const parts=dayParts(),col=dayColor();
  h+=`<div style="display:flex;align-items:flex-end;gap:10px;margin-top:14px">
      <div class="count" style="color:${col||"var(--text)"}">${d.length}</div>
      <div class="gap" style="color:${col||"var(--dim)"}">${
        routine.length===0?"добавь первый пункт":rk?RANKS[rk].t:`ещё ${left} до полного дня`}</div></div>
    <div class="bars ${cheerRank?"cheer":""}">
      ${routine.map(r=>`<div class="bar ${d.includes(r.id)?"on":""}" style="${
        d.includes(r.id)&&col?`background:${col};box-shadow:0 0 ${rk?18:12}px ${col}`:""}"></div>`).join("")}</div>
    ${parts.length?`<div class="mixbar">${parts.map(p=>
        `<i style="flex:${p.w};background:${p.c}"></i>`).join("")}</div>
      <div class="mixlab">${parts.map(p=>
        `<s><b style="background:${p.c}"></b>${NAMES[p.cat]} ×${p.n}</s>`).join("")}</div>`:""}
    <div class="week">${days(7).map(x=>{const v=scoreOf(x);
      return `<div class="wk"><i style="height:${Math.min(30,4+v*2)}px;background:${
        v&&v>=bst.v&&bst.v?"var(--gold)":x===t&&v?col||"var(--amber)":v?"var(--sage)":"var(--line)"}"></i><span>${lab(x)}</span></div>`}).join("")}</div>
    <div class="lvl"><div class="lvlbar"><i style="width:${bst.v?Math.min(100,sc/bst.v*100):sc?100:0}%;background:${
        isRec?"var(--gold)":col||"var(--sage)"}"></i></div>
      <div class="lvltext">${sc} оч.${bst.v?isRec?" · рекорд!":` · рекорд ${bst.v}`:""}</div></div>
    ${bst.v&&!isRec&&sc<bst.v?`<div style="font-size:11px;color:var(--dim);margin-top:6px">до рекорда ${Math.round((bst.v-sc)*10)/10}${bst.d?` (${lab(bst.d)})`:""}</div>`:""}`;

  /* срочное — над рутиной */
  const soon=S.items.filter(i=>{const m=dueMeta(i);return m&&m.show})
    .sort((a,b)=>a.due.localeCompare(b.due));
  if(soon.length){
    h+=`<section><h2>Сроки</h2><div class="sub">подходит дата</div>`;
    for(const it of soon)h+=rowHTML(it,CATS.find(c=>c.id===it.cat),true);
    h+=`</section>`;
  }

  for(const cat of CATS){
    const list=byCat(cat.id);
    const vis=cat.daily?list:[...list.filter(i=>!i.done),...list.filter(i=>i.done&&i.doneAt===t)];
    const bur=cat.daily?[]:list.filter(i=>i.done&&i.doneAt!==t);
    h+=`<section><h2>${cat.title}</h2><div class="sub">${cat.sub}</div><div class="list" data-cat="${cat.id}">`;
    if(!vis.length)h+=`<div class="empty">Пусто. Добавь ниже.</div>`;
    for(const it of vis)h+=rowHTML(it,cat,false);
    h+=`</div>`;
    if(bur.length){
      h+=`<div class="closed"><span data-closed="${cat.id}">закрыто раньше: ${bur.length} ${openClosed[cat.id]?"▴":"▾"}</span>`;
      if(openClosed[cat.id])for(const b of bur)h+=`<div><s>${esc(b.text)}</s><b data-toggle="${b.id}">вернуть</b></div>`;
      h+=`</div>`;
    }
    h+=adding===cat.id?`<div class="addrow"><input id="ad" placeholder="Что добавить"><button class="ok" data-add="${cat.id}">ок</button></div>`
      :`<button class="addbtn" data-open="${cat.id}">+ добавить</button>`;
    h+=`</section>`;
  }
  if(menuFor)h=`<div class="scrim" data-close="1"></div>`+h;
  if(moveFor)h+=`<button class="donebar" data-endmove="1">Готово — порядок сохранён</button>`;
  document.getElementById("app").innerHTML=h;
  const f=document.getElementById("rn")||document.getElementById("ad");
  if(f){f.focus();f.setSelectionRange(f.value.length,f.value.length)}
}

function rowHTML(it,cat,top){
  if(renaming===it.id&&!top)
    return `<div class="row"><input id="rn" value="${esc(it.text)}"><button class="ok" data-rename="${it.id}">ок</button></div>`;
  if(dueFor===it.id&&!top){
    const w=it.warn===undefined?3:it.warn;
    return `<div class="duebox">
      <div>Срок <input type="date" id="dd" value="${it.due||""}"></div>
      <div>Показать за <select id="dw">
        ${[0,1,3,7,14].map(n=>`<option value="${n}" ${n===w?"selected":""}>${n===0?"в день срока":n+" дн."}</option>`).join("")}
      </select></div>
      <div class="acts"><button class="ok" data-savedue="${it.id}">Сохранить</button>
      <button class="ghost" data-cleardue="${it.id}">Убрать срок</button></div></div>`;
  }
  const dn=isDone(it),mv=moveFor===it.id,hit=pulse===it.id,m=dueMeta(it);
  return `<div class="row c-${it.cat} ${dn?"done":""} ${mv?"moving":""} ${hit?"hit":""} ${m&&m.show?m.cls:""}" data-id="${it.id}">
    <i class="fx"></i>
    <button class="dot ${dn?"on":""} ${hit?"pop":""}" data-toggle="${it.id}" aria-label="${esc(it.text)}"></button>
    <span class="txt ${dn?"done":""}" data-toggle="${it.id}">${esc(it.text)}</span>
    ${m?`<span class="when ${m.cls}">${m.txt}</span>`:""}
    ${mv?`<span class="grip">≡</span>`:top?"":`<button class="more" data-menu="${it.id}">⋯</button>`}
    ${menuFor===it.id&&!top?menu(it,cat):""}</div>`;
}

const menu=(it,cat)=>`<div class="menu">
  <button data-rn="${it.id}">Переименовать</button>
  ${cat.daily?"":`<button data-due="${it.id}">${it.due?"Изменить срок":"Поставить срок"}</button>`}
  <button data-mv="${it.id}">Переместить</button><hr><div class="lab">Перенести в</div>
  ${CATS.filter(c=>c.id!==cat.id).map(c=>`<button data-to="${it.id}|${c.id}">${c.title}</button>`).join("")}
  <hr><button data-del="${it.id}" style="color:var(--red)">Удалить</button></div>`;

document.addEventListener("click",e=>{
  const a=k=>e.target.closest(`[data-${k}]`)?.dataset[k];
  if(a("close")){menuFor=null;return render()}
  if(a("gear")){settings=!settings;return render()}
  if(a("vibtest")){
    const n=document.getElementById("vibnote");
    if(!navigator.vibrate){n.textContent="Браузер не поддерживает вибрацию.";return}
    const ok=navigator.vibrate([60,60,120]);
    n.textContent=ok?"Импульс отправлен. Не почувствовал — включи вибрацию при касании в настройках телефона и проверь, что он не в беззвучном режиме."
                   :"Система отклонила вибрацию — она выключена на уровне телефона.";
    return}
  const sw=a("t"); if(sw){
    if(sw==="vol")S.vol=S.vol>1?1:1.8; else S[sw]=!S[sw];
    if(sw!=="vib")tone([659.25,824,988.9],.36,.3*S.vol,.055); else if(S.vib)buzz(35);
    store.save();return render()}
  const tg=a("toggle"); if(tg&&!moveFor)return toggle(tg);
  const m=a("menu"); if(m){menuFor=menuFor===m?null:m;return render()}
  const rn=a("rn"); if(rn){renaming=rn;menuFor=null;return render()}
  const du=a("due"); if(du){dueFor=du;menuFor=null;return render()}
  const sd=a("savedue"); if(sd){const it=S.items.find(x=>x.id===sd);
    const v=document.getElementById("dd").value;
    if(v){it.due=v;it.warn=+document.getElementById("dw").value}else delete it.due;
    dueFor=null;store.save();return render()}
  const cd=a("cleardue"); if(cd){const it=S.items.find(x=>x.id===cd);
    delete it.due;delete it.warn;dueFor=null;store.save();return render()}
  const mv=a("mv"); if(mv){moveFor=mv;menuFor=null;return render()}
  if(a("endmove")){moveFor=null;return render()}
  const to=a("to"); if(to){const[i,c]=to.split("|");const it=S.items.find(x=>x.id===i);
    it.cat=c;it.done=false;delete it.doneAt;
    if(CATS.find(x=>x.id===c).daily){delete it.due;delete it.warn}
    menuFor=null;store.save();return render()}
  const del=a("del"); if(del){S.items=S.items.filter(x=>x.id!==del);
    for(const k in S.log)S.log[k]=S.log[k].filter(x=>x!==del);menuFor=null;store.save();return render()}
  const sv=a("rename"); if(sv){const v=document.getElementById("rn").value.trim();
    if(v)S.items.find(x=>x.id===sv).text=v;renaming=null;store.save();return render()}
  const op=a("open"); if(op){adding=op;return render()}
  const ad=a("add"); if(ad){const v=document.getElementById("ad").value.trim();
    if(v)S.items.push({id:uid(),cat:ad,text:v});adding=null;store.save();return render()}
  const cl=a("closed"); if(cl){openClosed[cl]=!openClosed[cl];return render()}
});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;
  if(document.getElementById("rn"))document.querySelector("[data-rename]")?.click();
  else if(document.getElementById("ad"))document.querySelector("[data-add]")?.click()});

let drag=null;
document.addEventListener("pointerdown",e=>{
  if(!moveFor)return;
  const row=e.target.closest(".row"); if(!row||row.dataset.id!==moveFor)return;
  e.preventDefault();row.classList.add("lifting");
  drag={row,startY:e.clientY,list:row.parentElement};
  row.setPointerCapture?.(e.pointerId)});
document.addEventListener("pointermove",e=>{
  if(!drag)return; e.preventDefault();
  drag.row.style.transform=`translateY(${e.clientY-drag.startY}px)`;
  const r=drag.row.getBoundingClientRect(),mid=r.top+r.height/2;
  const prev=drag.row.previousElementSibling,next=drag.row.nextElementSibling;
  if(prev&&prev.classList.contains("row")){const p=prev.getBoundingClientRect();
    if(mid<p.top+p.height/2){drag.list.insertBefore(drag.row,prev);drag.startY-=p.height+7;
      drag.row.style.transform=`translateY(${e.clientY-drag.startY}px)`}}
  else if(next&&next.classList.contains("row")){const n=next.getBoundingClientRect();
    if(mid>n.top+n.height/2){drag.list.insertBefore(next,drag.row);drag.startY+=n.height+7;
      drag.row.style.transform=`translateY(${e.clientY-drag.startY}px)`}}
  if(e.clientY<90)scrollBy(0,-9);else if(e.clientY>innerHeight-90)scrollBy(0,9)},{passive:false});
document.addEventListener("pointerup",()=>{
  if(!drag)return;
  drag.row.style.transform="";drag.row.classList.remove("lifting");
  const cat=drag.list.dataset.cat,order=[...drag.list.querySelectorAll(".row")].map(r=>r.dataset.id);
  const map=Object.fromEntries(byCat(cat).map(i=>[i.id,i]));
  const q=[...order.map(id=>map[id]).filter(Boolean),...byCat(cat).filter(i=>!order.includes(i.id))];
  let k=0;S.items=S.items.map(i=>i.cat===cat?q[k++]:i);
  drag=null;store.save()});

/* первое касание разблокирует звук в Chrome */
addEventListener("pointerdown",()=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();
  if(ac.state==="suspended")ac.resume()}catch(e){}},{once:true});

store.load().then(d=>{if(d&&d.items)S={...S,...d};render()});
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
