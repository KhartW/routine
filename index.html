<!doctype html><html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>P:F</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17131f">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="P:F">
<link rel="apple-touch-icon" href="apple-touch-icon-v3.png">
<link rel="icon" href="icon-192-v3.png">
<style>
  :root{--bg:#17131f;--surf:#221c2d;--surf2:#2c2439;--line:#332b42;
    --text:#eae4dd;--dim:#8d84a0;--amber:#e0a458;--gold:#f3d29a;--sage:#7fa88b;--red:#c97b7b;
    --c-routine:#e0457b;--c-wish:#e0a458;--c-needed:#46c48c;--c-maybe:#8f9ad6}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  input,textarea{-webkit-user-select:text;user-select:text}
  html,body{background:var(--bg)}
  body{margin:0;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:calc(18px + env(safe-area-inset-top)) 18px calc(90px + env(safe-area-inset-bottom));
    max-width:560px;margin:0 auto;overscroll-behavior-y:contain}
  h1{font:500 15px/1 system-ui;letter-spacing:.14em;color:var(--dim);margin:0;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .nightmark{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.06em;
    color:#8f9ad6;white-space:nowrap;border:1px solid #8f9ad655;border-radius:20px;
    padding:4px 9px;margin-top:3px;line-height:1}
  .nightmark i{font-style:normal;font-size:11px;line-height:1;position:relative;top:.5px;opacity:.75}
  h2{font:400 20px Georgia,serif;margin:0 0 2px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:10px}
  .count{font:300 68px/.8 Georgia,serif}
  .gap{font-size:13px;padding-bottom:6px;color:var(--dim);transition:color .4s}
  .bars{display:flex;gap:4px;margin-top:16px}
  .bar{height:6px;flex:1;min-width:3px;border-radius:999px;background:var(--line);
    transition:background .45s,box-shadow .45s,transform .25s}
  .bar.on{background:var(--amber);box-shadow:0 0 12px #e0a45866}
  .mixbar{display:flex;gap:2px;margin-top:8px;height:9px}
  .mixbar i{display:block;border-radius:3px;transition:flex-grow .6s ease,background .6s ease}
  .mixlab{font-size:11px;color:var(--dim);margin-top:7px;display:flex;gap:12px;flex-wrap:wrap}
  .mixlab s{text-decoration:none;display:flex;align-items:center;gap:5px}
  .mixlab b{width:8px;height:8px;border-radius:50%;display:inline-block}
  @keyframes wave{0%,100%{transform:scaleY(1)}50%{transform:scaleY(2.8)}}
  .cheer .bar{animation:wave .55s ease}
  .cheer .bar:nth-child(2){animation-delay:.05s}.cheer .bar:nth-child(3){animation-delay:.1s}
  .cheer .bar:nth-child(4){animation-delay:.15s}.cheer .bar:nth-child(5){animation-delay:.2s}
  .cheer .bar:nth-child(6){animation-delay:.25s}.cheer .bar:nth-child(7){animation-delay:.3s}
  .bars{position:relative}
  .wavebox{position:absolute;right:0;top:50%;transform:translateY(-50%);height:30px;
    pointer-events:none;overflow:hidden;border-radius:999px;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 3px),transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 3px),transparent 100%)}
  .wave{position:absolute;right:0;top:0;height:100%;mix-blend-mode:screen;display:block}
  .wave g{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
  @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-400px)}}
  .wave .halo{stroke:var(--mid);stroke-width:13;opacity:.45;filter:blur(5px)}
  .wave .glow{stroke:var(--mid);stroke-width:7;opacity:.7;filter:blur(2px)}
  .wave .core{stroke:var(--edge);stroke-width:3.4;filter:blur(.6px)}
  .wave .hot{stroke:#fff;stroke-width:1.4;opacity:.92;animation:pulsehot 1.6s ease-in-out infinite}
  @keyframes pulsehot{0%,100%{opacity:.55;stroke-width:1.1}50%{opacity:1;stroke-width:1.7}}
  @keyframes breathe{0%,100%{box-shadow:0 0 12px var(--glowc)}50%{box-shadow:0 0 22px var(--glowc),0 0 5px #fff9}}
  .fx1{--edge:#c9a0ff;--mid:#7b3fd0;--glowc:#a55ce0}
  .fx2{--edge:#ffd27a;--mid:#ff7a1f;--glowc:#ffae3a}
  .fx3{--edge:#ffb3cc;--mid:#ff2e6b;--glowc:#ff4a86}
  .fx1 .bar.on,.fx2 .bar.on,.fx3 .bar.on{animation:breathe 2.4s ease-in-out infinite}
  .fx2 .bar.on{animation-duration:1.8s}.fx3 .bar.on{animation-duration:1.2s}
  .lvlbar{position:relative;overflow:visible}
  .week{display:flex;gap:6px;margin-top:20px;align-items:flex-end}
  .wk{flex:1;text-align:center}
  .wk i{display:block;border-radius:2px;background:var(--line);transition:height .4s}
  .wk span{font-size:10px;color:var(--dim);display:block;margin-top:5px}
  .lvl{margin-top:22px;display:flex;align-items:center;gap:10px}
  .lvlbar{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
  .lvlbar i{display:block;height:100%;background:var(--sage);transition:width .5s ease}
  .lvltext{font-size:11px;color:var(--dim);white-space:nowrap}
  section{margin-top:30px}
  .row{--acc:var(--amber);position:relative;display:flex;align-items:center;gap:12px;background:var(--surf);
    border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:7px;
    transition:transform .16s,border-color .2s,background .2s}
  .row.c-routine{--acc:var(--c-routine)} .row.c-wish{--acc:var(--c-wish)}
  .row.c-needed{--acc:var(--c-needed)}  .row.c-maybe{--acc:var(--c-maybe)}
  .row.done{border-color:transparent}
  .duesec{position:relative;border:1px solid #ff8a4d55;border-radius:14px;padding:20px 14px 12px;
    background:linear-gradient(180deg,#ff8a4d0f,transparent 60%);margin-top:30px}
  .duetag{position:absolute;top:-9px;left:14px;background:var(--bg);color:#ff8a4d;
    font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:0 8px}
  .duesec h2{color:#ffb184}
  .row.moving{border-color:var(--amber);background:var(--surf2);box-shadow:0 8px 26px #0009;touch-action:none;z-index:40}
  .row.lifting{transition:none;z-index:50}
  .fx{position:absolute;inset:0;border-radius:10px;overflow:hidden;pointer-events:none}
  .fx::before{content:"";position:absolute;inset:0;transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,var(--acc),transparent);opacity:.42}
  @keyframes sweep{to{transform:translateX(100%)}}
  .row.hit .fx::before{animation:sweep .55s ease}
  .dot{width:24px;height:24px;flex:0 0 auto;border-radius:50%;border:2px solid var(--line);
    background:none;padding:0;cursor:pointer;position:relative}
  .dot.on{background:var(--acc);border-color:var(--acc)}
  @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.55)}100%{transform:scale(1)}}
  @keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
  .dot.pop{animation:pop .45s ease}
  .dot.pop::before{content:"";position:absolute;inset:-2px;border-radius:50%;
    border:2px solid var(--acc);animation:ring .55s ease-out forwards}
  .txt{flex:1;font-size:16px;cursor:pointer;word-break:break-word}
  .txt.done{color:var(--dim);text-decoration:line-through}
  .when{font-size:11px;color:var(--dim);white-space:nowrap;flex:0 0 auto}
  .when.far{color:var(--dim)}.when.soon{color:var(--amber)}
  .when.tom{color:#ff8a4d}.when.today{color:#ff5c4d;font-weight:600}
  .when.late{color:#ff8a4d;font-weight:600}
  .more{background:none;border:none;color:var(--dim);font-size:19px;line-height:1;padding:6px 2px;cursor:pointer}
  .grip{color:var(--amber);font-size:19px;padding:6px 4px;touch-action:none;cursor:grab;user-select:none}
  .menu{position:absolute;top:calc(100% + 6px);right:6px;z-index:60;background:var(--surf2);
    border:1px solid var(--line);border-radius:12px;padding:6px;min-width:212px;box-shadow:0 10px 30px #000a}
  .menu button{display:block;width:100%;text-align:left;background:none;border:none;
    color:var(--text);font-size:15px;padding:11px 12px;border-radius:8px;cursor:pointer}
  .menu .lab{color:var(--dim);font-size:11px;padding:4px 12px 6px}
  .menu hr{border:none;border-top:1px solid var(--line);margin:5px 8px}
  .sgroup select{background:var(--bg);border:1px solid var(--line);border-radius:10px;
    padding:9px 10px;color:var(--text);font-size:14px;font-family:inherit;max-width:52%}
  .addbtn{background:none;border:1px dashed var(--line);border-radius:10px;padding:11px 14px;
    color:var(--dim);font-size:14px;width:100%;text-align:left;cursor:pointer;margin-top:4px}
  .addrow{display:flex;gap:8px;margin-top:8px}
  input{flex:1 1 auto;min-width:0;width:100%;background:var(--surf);border:1px solid var(--line);
    border-radius:10px;padding:13px 14px;color:var(--text);font-size:16px}
  .row input{background:var(--bg)}
  .ok{flex:0 0 auto;background:var(--amber);border:none;border-radius:10px;padding:12px 16px;
    color:var(--bg);font-size:15px;cursor:pointer;white-space:nowrap}
  .ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:9px 14px;color:var(--dim);font-size:14px;cursor:pointer}
  .empty{color:var(--dim);font-size:13px;padding:6px 0}
  .scrim{position:fixed;inset:0;z-index:55}
  .donebar{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--amber);color:var(--bg);
    border:none;width:100%;padding:18px calc(18px + env(safe-area-inset-bottom));font-size:16px;cursor:pointer}
  .gear{background:none;border:none;color:var(--dim);font-size:16px;cursor:pointer;padding:4px}
  .pill{display:inline-block;margin-top:10px;font-size:10px;padding:4px 9px;border-radius:20px;
    border:1px solid currentColor;white-space:nowrap}
  .pill.good{color:var(--sage)}.pill.warn{color:#ff8a4d}
  .difftask{font:400 20px/1.3 Georgia,serif;margin-bottom:10px}
  .duestate{margin-bottom:14px}
  .duestate .pill{margin-top:0}
  .ok.wide[disabled]{opacity:.4;cursor:default}
  .outline{background:none;border:1px solid var(--amber);border-radius:12px;padding:15px;
    color:var(--amber);font-size:15px;cursor:pointer;font-family:inherit}
  .outline.wide{width:100%}
  .outline[disabled]{opacity:.35;cursor:default;border-color:var(--line);color:var(--dim)}
  .pill{color:var(--dim)}
  .diffpick{cursor:pointer}
  .diffpick.on{background:var(--surf2);box-shadow:inset 3px 0 0 var(--amber)}
  .diffpick.on .lbl{color:var(--amber)}
  .diffmul{font-size:12px;color:var(--dim);flex:0 0 auto}
  .sgroup input[type=date]{background:var(--bg);border:1px solid var(--line);border-radius:10px;
    padding:9px 10px;color:var(--text);font-size:14px;font-family:inherit;flex:0 0 auto;width:auto}
  .danger{width:100%;padding:15px;background:none;border:1px solid #c97b7b66;border-radius:12px;
    color:var(--red);font-size:15px;cursor:pointer}
  .verrow{display:flex;align-items:baseline;gap:10px;padding:14px 16px 8px}
  .vernum{font:500 11px system-ui;letter-spacing:.1em;color:var(--amber)}
  .vertitle{font:400 17px Georgia,serif}
  .verline{font-size:13px;color:var(--dim);line-height:1.55;padding:0 16px 10px;
    position:relative;padding-left:30px}
  .verline:before{content:"";position:absolute;left:17px;top:8px;width:4px;height:4px;
    border-radius:50%;background:var(--line)}
  .sgroup .verline:last-child{padding-bottom:16px}
  .tasktitle{flex:1;font:400 21px/1.25 Georgia,serif;margin:0}
  .ghost.tiny{padding:7px 12px;font-size:13px}
  .stack{display:flex;flex-direction:column;gap:6px;margin:26px 0 4px}
  .pastcard{display:flex;align-items:center;gap:14px;background:var(--surf);
    border:1px solid var(--line);border-radius:14px;padding:14px 18px;cursor:pointer;
    transform-origin:center}
  .pastdot{width:20px;height:20px;border-radius:50%;background:var(--dim);flex:0 0 auto;opacity:.6}
  .pasttext{font:400 16px/1.3 Georgia,serif;color:var(--dim);text-decoration:line-through}
  .erow{padding:12px 14px}
  .curwrap{margin-top:14px}
  .curframe{position:relative;border-radius:18px;padding:2px;isolation:isolate;overflow:hidden}
  .curcard{position:relative;z-index:2;display:flex;align-items:center;gap:16px;overflow:hidden;
    background:var(--surf);border:1px solid var(--sc);border-radius:16px;padding:26px 20px;
    box-shadow:0 0 var(--sg) var(--sc);
    transition:border-color .5s,box-shadow .5s}
  .curtext{font:400 20px/1.35 Georgia,serif;color:var(--text)}
  .dot.big{width:34px;height:34px;border-width:2px;border-color:var(--sc);transition:border-color .5s}
  /* бегущая по контуру энергия на верхних ступенях */
  .ring{position:absolute;inset:-40%;z-index:1;border-radius:50%;
    background:conic-gradient(from 0deg,transparent 0 62%,var(--sc) 76%,#fff 80%,var(--sc) 84%,transparent 96%);
    animation:spin var(--spin,3s) linear infinite;opacity:.9}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* редкие искры у самой верхней ступени */
  .curbox{position:relative}
  .wavering{position:absolute;inset:0;border-radius:18px;border:2px solid var(--sc);
    pointer-events:none;z-index:4;opacity:0;
    animation:waveout .95s cubic-bezier(.15,.75,.3,1) forwards}
  .wavering.w2{animation-delay:.16s}
  .wavering.w3{animation-delay:.32s}
  @keyframes waveout{0%{opacity:.85;transform:scale(1)}
    100%{opacity:0;transform:scale(1.42)}}
  .motes{position:absolute;inset:-10px;z-index:3;pointer-events:none;overflow:hidden;border-radius:20px}
  .motes b{position:absolute;bottom:6px;width:3px;height:3px;border-radius:50%;background:var(--sc);
    opacity:0;animation:mote 2.6s ease-out infinite}
  @keyframes mote{0%{opacity:0;transform:translateY(0)}
    20%{opacity:.9}100%{opacity:0;transform:translateY(-54px)}}
  .lvl0 .curcard{box-shadow:none}
  .curhint{margin-top:12px;text-align:center}
  .emptytask{margin-top:40px;text-align:center}
  .emptytask p{margin:0 0 8px;font:400 18px Georgia,serif}
  .emptytask .ok{margin-top:16px;padding:14px 22px}
  .stepedit{margin-top:20px}
  .erow{display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);
    border-radius:10px;padding:11px 12px;margin-bottom:7px}
  .enum{color:var(--dim);font-size:12px;width:16px;flex:0 0 auto}
  .etext{flex:1;font-size:15px;word-break:break-word}
  .etext.is-done{color:var(--dim);text-decoration:line-through;cursor:pointer}
  .undo{display:inline-block;margin-left:8px;font-size:10px;font-weight:400;color:var(--sage);
    text-decoration:none;border:1px solid currentColor;border-radius:20px;padding:2px 7px}
  .finale{margin-top:30px;text-align:center}
  .fintitle{font:400 24px Georgia,serif;color:var(--gold);text-shadow:0 0 26px #e0a45855;margin-bottom:18px}
  .finlist{text-align:left;margin-bottom:20px}
  .finrow{display:flex;gap:10px;font-size:14px;color:var(--dim);padding:8px 4px;
    border-bottom:1px solid var(--line);text-decoration:line-through;
    opacity:0;animation:finin .5s ease forwards}
  @keyframes finin{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
  .fintitle{animation:swell .9s ease}
  .finrow span{color:var(--sage);text-decoration:none}
  .ok.wide{width:100%;padding:16px}
  .stepstag{font-size:10px;color:var(--sage);border:1px solid currentColor;border-radius:20px;
    padding:3px 8px;white-space:nowrap;flex:0 0 auto;cursor:pointer;opacity:.85}
  .bkp{position:relative;border:1px solid #8f9ad655;background:linear-gradient(180deg,#8f9ad612,transparent 70%);
    border-radius:14px;padding:16px 42px 16px 16px;margin-bottom:20px}
  .bkptxt b{display:block;font:400 16px Georgia,serif;color:var(--text);margin-bottom:5px}
  .bkptxt span{font-size:12px;color:var(--dim);line-height:1.5;display:block;max-width:34ch}
  .bkpact{margin-top:12px}
  .bkpx{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--dim);
    font-size:15px;padding:6px 8px;cursor:pointer}
  .shead{display:flex;align-items:center;gap:10px;margin-bottom:20px}
  .shead h2{margin:0;font:400 24px Georgia,serif}
  .back{background:none;border:none;color:var(--dim);font-size:30px;line-height:1;
    padding:0 6px 4px 0;cursor:pointer}
  .sgroup{background:var(--surf);border:1px solid var(--line);border-radius:14px;
    overflow:hidden;margin-bottom:14px}
  .sgroup h3{margin:0;padding:14px 16px 10px;font:500 10px system-ui;letter-spacing:.16em;
    text-transform:uppercase;color:var(--dim)}
  .srow{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:14px 16px;border-top:1px solid var(--line)}
  .lbl{font-size:15px}
  .sub2{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.5;max-width:38ch}
  .sact{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 16px;
    border-top:1px solid var(--line)}
  .hint{font-size:12px;color:var(--dim);line-height:1.5}
  .sfoot{text-align:center;color:var(--dim);font-size:11px;margin:26px 0 10px;opacity:.7}
  .sw{width:44px;height:26px;border-radius:14px;background:var(--line);border:none;position:relative;cursor:pointer;flex:0 0 auto}
  .sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:.2s}
  .sw.on{background:#4a3c2a}.sw.on i{left:21px;background:var(--amber)}
  .flash{position:fixed;inset:0;pointer-events:none;z-index:80;animation:flashin 1.1s ease-out forwards}
  @keyframes flashin{0%{opacity:0}14%{opacity:.6}100%{opacity:0}}
  .sparks{position:fixed;inset:0;pointer-events:none;z-index:81;overflow:hidden}
  .tierwave{position:fixed;left:0;right:0;bottom:0;height:220vh;z-index:84;pointer-events:none;
    opacity:.85;animation:rise 1.9s cubic-bezier(.25,.7,.35,1) forwards}
  @keyframes rise{from{transform:translateY(75%)}to{transform:translateY(-120%)}}
  .tiername{position:fixed;left:0;right:0;top:38vh;z-index:88;text-align:center;pointer-events:none;
    font:700 26px/1.1 Georgia,serif;letter-spacing:.22em;
    animation:tiername 2s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes tiername{0%{opacity:0;transform:translateY(28px) scale(.9)}
    18%{opacity:1;transform:translateY(0) scale(1.04)}26%{transform:scale(1)}
    72%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
  .recwrap{position:fixed;left:0;right:0;top:24vh;z-index:90;text-align:center;pointer-events:none;
    animation:recin 2.2s cubic-bezier(.2,.8,.3,1) forwards}
  .rec{font:700 30px/1.1 Georgia,serif;letter-spacing:.06em;color:var(--gold);
    text-shadow:0 0 26px #e0a45899,0 4px 18px #000}
  .recsub{font-size:13px;color:var(--text);margin-top:8px;opacity:.85}
  @keyframes recin{0%{opacity:0;transform:scale(.7) translateY(14px)}
    12%{opacity:1;transform:scale(1.06) translateY(0)}20%{transform:scale(1)}
    75%{opacity:1}100%{opacity:0;transform:scale(1.04) translateY(-16px)}}
  .ripple{position:fixed;left:50%;top:26vh;width:40px;height:40px;margin:-20px 0 0 -20px;
    border-radius:50%;border:2px solid;pointer-events:none;z-index:80;
    animation:rip 1.5s cubic-bezier(.15,.7,.3,1) forwards}
  .ripple.r2{animation-delay:.28s}
  @keyframes rip{0%{transform:scale(.3);opacity:.9}100%{transform:scale(16);opacity:0}}
  .sp{position:absolute;left:50%;top:26vh;width:7px;height:7px;border-radius:50%;
    animation:fly 1.05s cubic-bezier(.2,.7,.4,1) forwards}
  @keyframes fly{0%{transform:translate(0,0) scale(1);opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) scale(.15);opacity:0}}
  @keyframes swell{0%,100%{transform:scale(1)}30%{transform:scale(1.16)}}
  .count.swell{animation:swell .8s ease}
  .count.swell.big{animation:swell 1.2s ease}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<div id="app"></div>
<script>
const CATS=[
 {id:"routine",title:"Рутина",sub:"каждый день",daily:true},
 {id:"wish",title:"Желательное",sub:"хотелось бы, но не обязан",daily:true},
 {id:"needed",title:"Нужно сделать",sub:"без даты",daily:false},

const ACC={routine:"#e0457b",wish:"#e0a458",needed:"#46c48c",maybe:"#8f9ad6"};
const WEIGHT={routine:2,wish:2.5,needed:5,maybe:1.5};   // вес = сколько это стоит
const DIFF={low:{k:.5,name:"несложное"},mid:{k:1,name:"среднее"},
            high:{k:1.6,name:"сложное"},max:{k:2.4,name:"очень сложное"}};
const DIFF_ORDER=["low","mid","high","max"];
const DIFF_HINT={low:"пара минут, почти без затрат",mid:"обычное дело, как большинство",
                 high:"требует захода и сил",max:"давно висит, страшно начинать"};
const canDiff=cat=>cat==="needed"||cat==="maybe";
const itemWeight=it=>Math.round((WEIGHT[it.cat]||1)*(canDiff(it.cat)?DIFF[it.diff||"mid"].k:1)*100)/100;
const FULL_BONUS=6;                                     // сверху за всю рутину целиком

const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const toLin=v=>{v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)};
const toSrgb=v=>{const x=v<=.0031308?v*12.92:1.055*Math.pow(v,1/2.4)-.055;
  return Math.round(Math.max(0,Math.min(1,x))*255)};
function mix(parts){                      // [[hex,вес],...] -> "rgb(...)"
  const tot=parts.reduce((a,p)=>a+p[1],0); if(!tot)return null;
  const acc=[0,0,0];
  for(const [hex,w] of parts){const c=hex2rgb(hex);
    for(let i=0;i<3;i++)acc[i]+=toLin(c[i])*w/tot}
  return `rgb(${acc.map(toSrgb).join(",")})`;
}
function dayParts(){
  const t=today(),d=doneToday();
  const done={routine:byCat("routine").filter(r=>d.includes(r.id)),
              wish:byCat("wish").filter(w=>d.includes(w.id)),
              needed:S.items.filter(i=>i.cat==="needed"&&i.done&&i.doneAt===t),
              maybe:S.items.filter(i=>i.cat==="maybe"&&i.done&&i.doneAt===t)};
  const full=routineFull(t);
  return Object.keys(done).filter(k=>done[k].length).map(k=>({cat:k,n:done[k].length,
    w:done[k].reduce((a,it)=>a+itemWeight(it),0)+(k==="routine"&&full?FULL_BONUS:0),c:ACC[k]}));
}
const dayColor=()=>{const p=dayParts();return p.length?mix(p.map(x=>[x.c,x.w])):null};

/* очки дня: тот же вес, что и у цвета */
/* ---- запечатанный день: не итог, а состав ----
   {r:[сделано,всего], w:желательных, n:{сложность:кол-во}, m:{...}, x:очки из старых версий} */
function buildDay(date){
  const ids=S.log[date]||[], rout=byCat("routine");
  const doneR=rout.filter(x=>ids.includes(x.id)).length;
  const rec={r:[doneR,rout.length],w:byCat("wish").filter(x=>ids.includes(x.id)).length,n:{},m:{}};
  for(const it of S.items){
    if(!it.done||it.doneAt!==date)continue;
    const box=it.cat==="needed"?rec.n:it.cat==="maybe"?rec.m:null;
    if(box){const k=it.diff||"mid";box[k]=(box[k]||0)+1}
  }
  return rec;
}
function scoreOfRecord(rec){
  let sc=(rec.r?.[0]||0)*WEIGHT.routine;
  if(rec.r&&rec.r[1]&&rec.r[0]===rec.r[1])sc+=FULL_BONUS;
  sc+=(rec.w||0)*WEIGHT.wish;
  for(const k in rec.n||{})sc+=WEIGHT.needed*DIFF[k].k*rec.n[k];
  for(const k in rec.m||{})sc+=WEIGHT.maybe*DIFF[k].k*rec.m[k];
  sc+=rec.x||0;                       // очки, унаследованные из старого формата
  return Math.round(sc*10)/10;
}

function resetDailySteps(){
  const t=today(); let changed=false;
  for(const it of S.items){
    const cat=CATS.find(c=>c.id===it.cat);
    if(!cat||!cat.daily||!(it.steps||[]).length)continue;
    if(it.stepsDay===t)continue;
    if(it.stepsDay!==undefined)                       // новый день — начинаем шаги заново
      for(const st of it.steps)delete st.done;
    it.stepsDay=t; changed=true;
  }
  return changed;
}
function sweep(){
  const t=today(); let changed=resetDailySteps();
  if(!S.days)S.days={};
  const dates=new Set([...Object.keys(S.log),...S.items.filter(i=>i.doneAt).map(i=>i.doneAt)]);
  for(const d of dates){                       // прожитый день сворачиваем в состав
    if(d===t||S.days[d])continue;
    S.days[d]=buildDay(d); changed=true;
  }
  const before=S.items.length;
  S.items=S.items.filter(it=>{                 // закрытые дела прошлых дней убираем
    const cat=CATS.find(c=>c.id===it.cat);
    return !(cat&&!cat.daily&&it.done&&it.doneAt&&it.doneAt!==t);
  });
  for(const d of Object.keys(S.log))if(d!==t){delete S.log[d];changed=true}
  if(changed||before!==S.items.length)store.save();
  return before-S.items.length;
}

/* перенос данных старых версий */
function migrate(){
  if(S.v>=2)return;
  const t=today(); S.days=S.days||{};
  const dates=new Set([...Object.keys(S.log||{}),...Object.keys(S.past||{}),
                       ...S.items.filter(i=>i.doneAt).map(i=>i.doneAt)]);
  for(const d of dates){
    if(d===t)continue;
    const rec=buildDay(d);
    if(S.full&&S.full[d])rec.r=[rec.r[0],rec.r[0]];   // знали, что рутина была полной
    if(S.past&&S.past[d])rec.x=S.past[d];             // очки без состава — как есть
    S.days[d]=rec;
  }
  delete S.past; delete S.full;
  S.v=2; store.save();
}

function wishFull(date){
  const w=byCat("wish"); if(!w.length)return false;
  const ids=S.log[date]||[]; return w.every(x=>ids.includes(x.id));
}
function routineFullLive(date){
  const r=byCat("routine"); if(!r.length)return false;
  const ids=S.log[date]||[]; return r.every(x=>ids.includes(x.id));
}
function routineFull(date){
  if(date===today())return routineFullLive(date);
  const rec=S.days&&S.days[date];
  return rec&&rec.r&&rec.r[1]>0&&rec.r[0]===rec.r[1];
}
function scoreOf(date){
  if(date!==today()&&S.days&&S.days[date])return scoreOfRecord(S.days[date]);
  const ids=S.log[date]||[]; let sc=0;
  for(const id of ids){const it=S.items.find(x=>x.id===id); if(it)sc+=itemWeight(it)}
  for(const it of S.items)if(it.done&&it.doneAt===date)sc+=itemWeight(it);
  if(routineFull(date))sc+=FULL_BONUS;
  return Math.round(sc*10)/10;
}
function best(exceptToday){
  const t=today(); let b={v:0,d:null};
  const dates=new Set([...Object.keys(S.days||{}),...Object.keys(S.log),
                       ...S.items.filter(i=>i.doneAt).map(i=>i.doneAt)]);
  for(const d of dates){ if(exceptToday&&d===t)continue;
    const v=scoreOf(d); if(v>b.v)b={v,d} }
  return b;
}

const WAVE_L=400, WAVE_W=800;          // длина цикла и всего полотна
/* случайные гармоники, но только те, что укладываются в цикл целое число раз:
   форма непредсказуемая, а через WAVE_L повторяется точно — стыка нет */
function buildWave(amp,y){
  const parts=[];
  for(let k=7;k<=34;k++){
    if(Math.random()<.42)continue;                    // часть частот выбрасываем
    parts.push({k,a:(Math.random()*.9+.35)/Math.pow(k,.85),ph:Math.random()*Math.PI*2});
  }
  const raw=[],step=1;
  for(let x=0;x<=WAVE_W;x+=step){
    let v=0;
    for(const p of parts)v+=p.a*Math.sin(2*Math.PI*p.k*x/WAVE_L+p.ph);
    raw.push(v);
  }
  const peak=Math.max(...raw.map(Math.abs))||1, k=amp/peak;
  let d="";
  for(let i=0;i<raw.length;i++)
    d+=(i?" L":"M")+(i*step)+","+(y-raw[i]*k).toFixed(2);
  return d;
}
const WAVE_CACHE={}, WAVE_T0=Date.now();
const waveFor=(amp,y)=>WAVE_CACHE[amp]||(WAVE_CACHE[amp]=buildWave(amp,y));

function waveSVG(speed,amp,pct){
  const y=22, d=waveFor(amp,y);
  // окно показывает часть полосы, а полотно всегда во всю её ширину —
  // поэтому длина волны на экране постоянна
  const phase=-(((Date.now()-WAVE_T0)/1000)%speed).toFixed(2);
  return `<div class="wavebox" style="width:${pct}%">
    <svg class="wave" style="width:${(10000/pct).toFixed(1)}%" viewBox="0 0 300 44"
      preserveAspectRatio="none" aria-hidden="true">
    <g style="animation-duration:${speed}s;animation-delay:${phase}s">
      <path class="halo" fill="none" d="${d}"/>
      <path class="glow" fill="none" d="${d}"/>
      <path class="core" fill="none" d="${d}"/>
      <path class="hot"  fill="none" d="${d}"/></g></svg></div>`;
}

/* ---------- отклик ---------- */
let ac=null;
function tone(freqs,dur=.34,vol=.3,gap=.055,echo=true){
  if(!S.snd)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended")ac.resume();
    const out=ac.createGain(); out.gain.value=1; out.connect(ac.destination);
    const play=(f,t,v,d)=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.type="triangle";o.frequency.value=f;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(v,t+.015);
      g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g);g.connect(out);o.start(t);o.stop(t+d+.08);
    };
    freqs.forEach((f,i)=>{
      const t=ac.currentTime+i*gap;
      play(f,t,vol,dur);
      if(echo)play(f*2,t+.11,vol*.16,dur*.8);   // тихий верхний отзвук
    });
  }catch(e){}
}

function rank(){

const TIERS=[
 {min:0, name:"пусто",       c:"#5a5470"},
 {min:1, name:"обычный",     c:"#9aa6b2"},
 {min:7, name:"необычный",   c:"#4fbf6a"},

function tierOf(v){
  let i=0; for(let k=0;k<TIERS.length;k++)if(v>=TIERS[k].min)i=k;
  return {i,t:TIERS[i],next:TIERS[i+1]||null,
          prog:TIERS[i+1]?(v-TIERS[i].min)/(TIERS[i+1].min-TIERS[i].min):1};
}
const NAMES={routine:"рутина",wish:"желательное",needed:"нужное",maybe:"можно"};

function toggle(id){
  const it=S.items.find(x=>x.id===id); if(!it||moveFor)return;
  const cat=CATS.find(c=>c.id===it.cat),t=today(),before=rank();
  const wasRecord=scoreOf(t)>best(true).v;
  const rB=routineFull(t),wB=wishFull(t),tiB=tierOf(scoreOf(t)).i;
  if(cat.daily){
    const d=doneToday(),has=d.includes(id);
    S.log[t]=has?d.filter(x=>x!==id):[...d,id];
    if(!has){
      const rA=routineFull(t),wA=wishFull(t);
      let kind=null;
      if(rA&&wA&&!(rB&&wB))kind="both";
      else if(rA&&!rB)kind="routine";
      else if(wA&&!wB)kind="wish";
      reward(id,kind,wasRecord,tiB); store.save(); return render();
    }
  }else{
    if(!it.done){
      it.done=true; it.doneAt=t;
      reward(id,null,wasRecord,tiB); store.save(); return render();
    }
    it.done=false;delete it.doneAt;
  }
  store.save();render();
}

function reward(id,kind,wasRecord,tierBefore){
  pulse=id;
  const tiA=tierOf(scoreOf(today())).i;
  tierUp=(tiA>tierBefore&&tiA>=4)?tiA:0;      // не тянем эффект на следующие отметки
  if(tierUp)tierSound(tierUp);
  sound(kind,wasRecord,tierUp>0);
  const hold=tierUp?2000:kind==="both"?1800:kind?1300:700;
  setTimeout(()=>{pulse=null;cheerRank=0;burst=null;tierUp=0;render()},hold);
}

const SCALE=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.51,1567.98,1760,2093];

function tierSound(i){
  const b=[196,246.94,329.63][i-4];          // соль / си / ми
  const v=.34*S.vol;
  tone([b,b*2],.18,v,.02,false);                                   // ту
  setTimeout(()=>tone([b*1.5,b*3],.34,v,.02,false),175);           // дун
  setTimeout(()=>tone([b,b*2],.18,v*.92,.02,false),440);           // ту
  setTimeout(()=>tone([b*2,b*3,b*4],.6,v*.95,.03,true),615);       // ду-у-ун
  buzz([45,55,45,60,45,140]);
}

function sound(kind,wasRecord,skipTone){
  const t=today();
  const step=(S.log[t]||[]).length + S.items.filter(i=>i.done&&i.doneAt===t).length;

  if(kind){
    burst=kind; cheerRank=kind==="both"?4:kind==="wish"?2:1;
    if(skipTone)return;
    const r0=best(true).v;
    if(!wasRecord&&r0>0&&scoreOf(t)>r0){record=true;setTimeout(()=>{record=false;render()},2400)}
    if(kind==="routine"){
      tone([392,523.25,659.25,783.99,1046.5],.5,.34*S.vol,.075);
      buzz([20,40,20,40,20,90]);
    }else if(kind==="wish"){
      tone([440,587.33,739.99,880],.46,.32*S.vol,.08);
      buzz([25,45,25,80]);
    }else{
      tone([261.63,392,523.25,659.25,783.99,1046.5,1318.5],.62,.38*S.vol,.085);
      setTimeout(()=>tone([1046.5,1318.5,1568,2093],.7,.2*S.vol,.05),620);
      buzz([30,40,30,40,30,40,30,160]);
    }
    return;
  }

  if(skipTone)return;
  const i=Math.min(step,SCALE.length-1), n=SCALE[i];
  const chord=[n,n*1.25,n*1.5];
  if(step>=5)chord.push(n*2);
  const vol=(.24+Math.min(step,10)*.014)*S.vol;
  tone(chord,.36+Math.min(step,8)*.012,vol,.055);
  buzz(30+Math.min(step,8)*3);

  const rec=best(true).v;
  if(!wasRecord&&rec>0&&scoreOf(t)>rec){
    cheerRank=4; record=true;
    setTimeout(()=>tone([n*2,n*2.5,n*3,n*4],.6,.24*S.vol,.07),240);
    buzz([25,35,25,35,25,110]);
    setTimeout(()=>{record=false;render()},2200);
  }
}

const DAYS_BETWEEN=(a,b)=>Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/864e5);
const BACKUP_OPTS=[[3,"каждые 3 дня"],[7,"раз в неделю"],[14,"раз в 2 недели"],[30,"раз в месяц"],[0,"не напоминать"]];
function backupDue(){
  const every=S.backupEvery===undefined?7:S.backupEvery;
  if(!every)return 0;
  if(S.backupHidden===today())return 0;                       // скрыто до завтра
  const hasData=S.items.length||Object.keys(S.days||{}).length;
  if(!hasData)return 0;
  if(!S.lastBackup)return -1;                                 // копии не было никогда
  const d=DAYS_BETWEEN(S.lastBackup,today());
  return d>=every?d:0;
}
function backupName(){return `pf-backup-${today()}.json`}
function exportData(){
  const data=JSON.stringify(S,null,1), name=backupName();
  S.lastBackup=today(); store.save();
  try{
    const file=new File([data],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:name}).catch(()=>{});
      return "Копия отправлена — выбери, куда сохранить.";
    }
  }catch(e){}
  const url=URL.createObjectURL(new Blob([data],{type:"application/json"}));
  const a=document.createElement("a"); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  return "Файл скачан: "+name;
}
function applyImport(text,note){
  let d;
  try{d=JSON.parse(text)}catch(e){note("Не похоже на файл копии — не удалось прочитать.");return}
  if(!d||typeof d!=="object"||!Array.isArray(d.items)){
    note("В файле нет данных приложения.");return}
  const days=Object.keys(d.days||d.log||{}).length;
  if(!confirm(`Заменить текущие данные? В файле: дел ${d.items.length}, дней ${days}. Отменить будет нельзя.`))return;
  S={...S,...d}; if(!S.days)S.days={}; migrate(); sweep(); store.save(); render();
  note(`Загружено: дел ${S.items.length}, дней ${Object.keys(S.days).length}.`);
}
function pickImport(note){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=()=>{const f=inp.files&&inp.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>applyImport(String(r.result),note);
    r.onerror=()=>note("Не удалось прочитать файл.");
    r.readAsText(f);};
  inp.click();
}

const icsEsc=x=>String(x).replace(/\\/g,"\\\\").replace(/[,;]/g,m=>"\\"+m).replace(/\r?\n/g,"\\n");
const icsStamp=d=>d.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
function icsFor(it){
  const warn=it.warn===undefined?3:it.warn;
  const daily=!!it.rep&&warn>0;                       // повторять каждый день до срока
  const due=new Date(it.due+"T09:00:00");
  const first=new Date(due); if(daily)first.setDate(due.getDate()-warn);
  const fmt=d=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${
    String(d.getDate()).padStart(2,"0")}T${String(d.getHours()).padStart(2,"0")}0000`;
  const endD=new Date(first); endD.setMinutes(30);
  const alarms=(daily?[0]:[0,warn].filter((v,i,a)=>a.indexOf(v)===i)).map(n=>
    ["BEGIN:VALARM","ACTION:DISPLAY",
     `TRIGGER:${n?"-P"+n+"D":"-PT0M"}`,
     `DESCRIPTION:${icsEsc(it.text)}`,"END:VALARM"].join("\r\n"));
  const [y,m,dd]=it.due.split("-");
  const human=`${+dd} ${MON[+m-1]}`;
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//P:F//routine//RU","CALSCALE:GREGORIAN",
    "BEGIN:VEVENT",`UID:pf-${it.id}-${y}${m}${dd}@routine`,
    `DTSTAMP:${icsStamp(new Date())}`,
    `DTSTART:${fmt(first)}`,
    `DTEND:${fmt(first).slice(0,11)}3000`,
    ...(daily?[`RRULE:FREQ=DAILY;COUNT=${warn+1}`]:[]),
    `SUMMARY:${icsEsc(daily?it.text+" — до "+human:it.text)}`,
    `DESCRIPTION:${icsEsc("Срок из P:F · "+(CATS.find(c=>c.id===it.cat)||{}).title+" · срок "+human)}`,
    ...alarms,"END:VEVENT","END:VCALENDAR"].join("\r\n");
}
function exportICS(id){
  const it=S.items.find(x=>x.id===id); if(!it||!it.due)return;
  const text=icsFor(it), name=`${it.text.replace(/[^\p{L}\p{N} _-]/gu,"").trim().slice(0,40)||"срок"}.ics`;
  try{
    const file=new File([text],name,{type:"text/calendar"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:it.text}).catch(()=>{}); return;
    }
  }catch(e){}
  const url=URL.createObjectURL(new Blob([text],{type:"text/calendar"}));
  const a=document.createElement("a"); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function dueMeta(it){
  if(!it.due||it.done)return null;
  const n=daysTo(it.due);
  const warn=it.warn===undefined?3:it.warn;
  const txt=n<0?`ждёт с ${dateLab(it.due)}`:n===0?"сегодня":n===1?"завтра":`через ${n} дн.`;
  const cls=n<0?"late":n===0?"today":n===1?"tom":n<=3?"soon":"far";
  return {n,txt,show:n<=warn,cls};
}

/* про рекорд молчим, пока он далеко: близко — подсказка, побит — след */
function recHint(sc,bst){
  if(!bst.v||!sc)return "";
  if(sc>bst.v)return ` · <b style="color:var(--gold);font-weight:600">рекорд побит</b>`;
  if(sc===bst.v)return ` · <b style="color:var(--gold);font-weight:600">вровень с рекордом</b>`;
  const left=Math.round((bst.v-sc)*10)/10;
  const near=Math.max(4,bst.v*.25);
  return left<=near?` · <b style="color:var(--gold);font-weight:600">до рекорда ${left}</b>`:"";
}

function stepSound(n){

function toggleStep(sid){
  const it=S.items.find(x=>x.id===taskFor); if(!it)return;
  const st=stepsOf(it).find(x=>x.id===sid); if(!st)return;
  if(st.done){st.done=false;store.save();return render()}
  st.done=true; stepPulse=sid;
  const doneN=stepsOf(it).filter(x=>x.done).length;
  const last=stepsOf(it).every(x=>x.done);
  if(last){burst="both";cheerRank=4;
    tone([261.63,392,523.25,659.25,783.99,1046.5,1318.5],.62,.4*S.vol,.085);
    setTimeout(()=>tone([1046.5,1318.5,1568,2093],.7,.22*S.vol,.05),620);

}

           wish:["var(--c-wish)","#ffd79a"],
           both:["var(--c-routine)","var(--c-wish)"]};
function burstHTML(){
  if(!burst)return "";
  const [c1,c2]=FXC[burst], n=burst==="both"?30:burst==="wish"?14:18;
  const dur=burst==="both"?1.7:1.15;
  return `<div class="flash" style="animation-duration:${dur}s;background:
      radial-gradient(circle at 50% 26%, ${c1}, transparent 60%)
      ${burst==="both"?`,radial-gradient(circle at 50% 26%, ${c2}, transparent 78%)`:""}"></div>
    ${burst==="both"?`<div class="ripple" style="border-color:${c2}"></div>
                      <div class="ripple r2" style="border-color:${c1}"></div>`:""}
    <div class="sparks">${Array.from({length:n},(_,i)=>{
      const a=(i/n)*Math.PI*2, r=(burst==="both"?120:90)+Math.random()*(burst==="both"?190:130);
      return `<i class="sp" style="--dx:${Math.round(Math.cos(a)*r)}px;--dy:${
        Math.round(Math.sin(a)*r-40)}px;background:${i%2?c1:c2};animation-duration:${
        dur*.9}s;animation-delay:${(i%5)*45}ms"></i>`}).join("")}</div>`;
}

/* ступень карточки шага: растёт по доле пройденного, последний шаг — всегда максимум */
const STEP_TIERS=[
 {c:"var(--line)", glow:0},                       // старт: обычная
 {c:"#4fbf6a",     glow:14},
 {c:"#4a9be0",     glow:20},
 {c:"#a55ce0",     glow:26, spin:3.4},            // эпический
 {c:"#e0a458",     glow:32, spin:2.2, spark:1},   // легендарный
 {c:"#e0457b",     glow:40, spin:1.3, spark:2}];  // мифический
function stepTier(doneN,total){
  if(!total)return 0;
  if(doneN>=total-1&&doneN>0)return 5;            // остался последний
  if(doneN===0)return 0;
  const p=doneN/total;
  return p<.26?1:p<.45?2:p<.65?3:4;
}

function taskHTML(){
  const it=S.items.find(x=>x.id===taskFor);
  if(!it){taskFor=null;return null}
  const steps=stepsOf(it), done=steps.filter(x=>x.done), cur=steps.find(x=>!x.done);
  const allDone=steps.length>0&&!cur;
  const head=`<div class="shead"><button class="back" data-taskback="1">‹</button>
    <h2 class="tasktitle">${esc(it.text)}</h2>
    <button class="ghost tiny" data-taskedit="1">${taskEdit?"готово":"править"}</button></div>`;

  if(taskEdit){
    return head+`<div class="stepedit list" data-steps="1">
      ${steps.map((st,i)=>`<div class="row erow ${stepMove===st.id?"moving":""}" data-id="${st.id}">
        <span class="enum">${i+1}</span>
        <span class="etext ${st.done?"is-done":""}" ${st.done?`data-stepundo="${st.id}"`:""}>${
          esc(st.text)}${st.done?`<b class="undo">вернуть</b>`:""}</span>
        ${stepMove===st.id?`<span class="grip">≡</span>`
          :`<button class="more" data-stepmenu="${st.id}">⋯</button>`}
        ${stepMenu===st.id?`<div class="menu">
            <button data-stepmv="${st.id}">Переместить</button>
            <hr><button data-stepdel="${st.id}" style="color:var(--red)">Удалить</button></div>`:""}
      </div>`).join("")}
      </div>
      ${stepAdding?`<div class="addrow"><input id="stepin" placeholder="после … я …">
        <button class="ok" data-stepadd="1">ок</button></div>
      <div class="hint" style="margin-top:10px">Шаг легче начать, если в нём записан момент запуска: «после завтрака», «когда сяду за стол».</div>`
      :`<button class="addbtn" data-stepopen="1">+ добавить шаг</button>`}
      ${stepMove?`<button class="donebar" data-stependmove="1">Готово — порядок сохранён</button>`:""}`;
  }

  if(!steps.length)
    return head+`<div class="emptytask">
      <p>У этого дела пока нет шагов.</p>
      <p class="hint">Разбей его на части — видно будет только ту, которой занимаешься.</p>
      <button class="ok" data-taskedit="1">Добавить шаги</button></div>`;

  if(allDone)
    return burstHTML()+head+`<div class="finale">
      <div class="fintitle">Все шаги пройдены</div>
      <div class="finlist">${steps.map((st,i)=>
        `<div class="finrow" style="animation-delay:${120+i*90}ms"><span>${i+1}</span>${esc(st.text)}</div>`).join("")}</div>
      <button class="ok wide" data-taskclose="${it.id}">Закрыть дело</button>
      <div class="hint" style="margin-top:10px">Или вернись к списку — отметить можно позже.</div></div>`;

  const lvl=stepTier(done.length,steps.length), T=STEP_TIERS[lvl];
  const tail=done.slice(-4);
  return head+`<div class="stack">${tail.map((st,i)=>
      `<div class="pastcard" style="opacity:${.3+i*.17};transform:scale(${.9+i*.025})"
        data-step="${st.id}">
        <span class="pastdot"></span><span class="pasttext">${esc(st.text)}</span></div>`).join("")}</div>
    <div class="curwrap">
      <div class="curbox" style="--sc:${T.c}">
      ${stepPulse&&lvl>=3?`<i class="wavering"></i><i class="wavering w2"></i>
        ${lvl>=5?`<i class="wavering w3"></i>`:""}`:""}
      <div class="curframe lvl${lvl}" style="--sc:${T.c};--sg:${T.glow}px${
        T.spin?`;--spin:${T.spin}s`:""}">
        ${T.spin?`<i class="ring"></i>`:""}
        ${T.spark?`<i class="motes">${Array.from({length:7},(_,i)=>
          `<b style="left:${8+i*13}%;animation-delay:${i*280}ms"></b>`).join("")}</i>`:""}
        <div class="curcard ${stepPulse===cur.id?"hit":""}">
          <i class="fx"></i>
          <button class="dot big" data-step="${cur.id}" aria-label="${esc(cur.text)}"></button>
          <div class="curtext">${esc(cur.text)}</div>
        </div>
      </div></div>
      <div class="hint curhint">Сделал — отметь, появится следующий</div>
    </div>`;
}

    document.body&&document.body.classList.toggle("dragmode",!!stepMove);
    const f=stepAdding?document.getElementById("stepin"):null;
    if(f){f.focus();f.value=""}
    return;
  }
  if(notes){
    document.getElementById("app").innerHTML=notesHTML();
    return;
  }
  if(settings){
    document.getElementById("app").innerHTML=settingsHTML();
    document.body&&document.body.classList.toggle("dragmode",false);
    return;
  }
  const t=today(),d=doneToday(),routine=byCat("routine");
  const doneR=routine.filter(r=>d.includes(r.id)).length,left=routine.length-doneR;
  const sc=scoreOf(t),bst=best(true),isRec=sc>bst.v&&bst.v>0;
  const TI=tierOf(sc), tc=TI.t.c;
  const rk=rank();
  const parts=dayParts(),col=dayColor(),due=backupDue();
  let fx=tierUp?`<div class="tierwave" style="background:linear-gradient(to top,
      transparent 0%, ${TIERS[tierUp].c}00 18%, ${TIERS[tierUp].c} 38%, ${TIERS[tierUp].c}00 62%, transparent 100%)"></div>
    <div class="tiername" style="color:${TIERS[tierUp].c};text-shadow:0 0 30px ${TIERS[tierUp].c}"
      >${TIERS[tierUp].name.toUpperCase()}</div>`:"";
  fx+=record?`<div class="recwrap"><div class="rec">НОВЫЙ РЕКОРД</div>
      <div class="recsub">${sc} оч. · ${TI.t.name}</div></div>`:"";
  fx+=burstHTML();
  let h=fx+(due?`<div class="bkp">
      <div class="bkptxt"><b>${due<0?"Резервной копии ещё не было":`Копии не было ${due} ${
        due%10===1&&due%100!==11?"день":due%10>=2&&due%10<=4&&(due%100<10||due%100>=20)?"дня":"дней"}`}</b>
        <span>Данные живут только в этом браузере. Копия занимает пару секунд.</span></div>
      <div class="bkpact"><button class="ok" data-export="1">Сохранить копию</button></div>
      <button class="bkpx" data-bkphide="1" aria-label="Скрыть">✕</button></div>`:"")
    +`<div style="display:flex;align-items:center;justify-content:space-between">
    <h1>${lab(t)} · ${dateLab(t)}${
      S.lateDay&&iso(new Date())!==t?`<span class="nightmark"><span>ночь</span><i>→</i><span>${dateLab(iso(new Date()))}</span></span>`:""}</h1><button class="gear" data-gear="1">${settings?"✕":"⚙"}</button></div>`;
  h+=`<div style="display:flex;align-items:flex-end;gap:10px;margin-top:14px">
      <div class="count ${burst?"swell":""} ${burst==="both"?"big":""}" style="color:${tc}">${d.length}</div>
      <div class="gap" style="color:${tc}">${
        routine.length===0?"добавь первый пункт":rk?RANKS[rk].t:`ещё ${left} до полного дня`}</div></div>
    <div class="bars ${cheerRank?"cheer":""} ${TI.i>=4?"fx"+(TI.i-3):""}">
      ${TI.i>=4?waveSVG([8.4,5.8,4][TI.i-4],[4.4,5.1,5.9][TI.i-4],
          routine.length?Math.max(6,Math.round(doneR/routine.length*100)):100):""}
      ${[...routine.filter(r=>!d.includes(r.id)),...routine.filter(r=>d.includes(r.id))]
        .map(r=>`<div class="bar ${d.includes(r.id)?"on":""}" style="${
        d.includes(r.id)?`background:${tc};box-shadow:0 0 ${rk?18:12}px ${tc}`:""}"></div>`).join("")}</div>
    ${parts.length?`<div class="mixbar">${parts.map(p=>
        `<i style="flex:${p.w};background:${p.c}"></i>`).join("")}</div>
      <div class="mixlab">${parts.map(p=>
        `<s><b style="background:${p.c}"></b>${NAMES[p.cat]} ×${p.n}</s>`).join("")}${
        routineFull(t)?`<s style="color:var(--c-routine)">+${FULL_BONUS} вся рутина</s>`:""}</div>`:""}
    <div class="week">${weekDays().map(x=>{const v=scoreOf(x);
      return `<div class="wk"><i style="height:${Math.min(30,4+v*2)}px;background:${
        v?tierOf(v).t.c:"var(--line)"};opacity:${x===t?1:x>t?.35:.75}"></i><span>${lab(x)}</span></div>`}).join("")}</div>
    <div class="lvl"><div class="lvlbar ${TI.i>=4?"fx"+(TI.i-3):""}"><i style="width:${Math.round(TI.prog*100)}%;background:linear-gradient(90deg,${
        tc},${TI.next?TI.next.c:tc})"></i></div>
      <div class="lvltext" style="color:${tc}">${sc} оч. · ${TI.t.name}</div></div>
    <div style="font-size:11px;color:var(--dim);margin-top:6px">${
      TI.next?`до «${TI.next.name}» ${Math.round((TI.next.min-sc)*10)/10}`:"выше некуда"}${
      recHint(sc,bst)}</div>`;

  /* срочное — над рутиной */
  const soon=S.items.filter(i=>{const m=dueMeta(i);return m&&m.show})
    .sort((a,b)=>a.due.localeCompare(b.due));
  if(soon.length){
    h+=`<section class="duesec"><div class="duetag">срок подходит</div>`;
    for(const it of soon)h+=rowHTML(it,CATS.find(c=>c.id===it.cat),true);
    h+=`</section>`;
  }

  for(const cat of CATS){
    const list=byCat(cat.id);
    const vis=cat.daily?list:list.filter(i=>!i.done||i.doneAt===t);
    h+=`<section><h2>${cat.title}</h2><div class="sub">${cat.sub}</div><div class="list" data-cat="${cat.id}">`;
    if(!vis.length)h+=`<div class="empty">Пусто. Добавь ниже.</div>`;
    for(const it of vis)h+=rowHTML(it,cat,false);
    h+=`</div>`;
    h+=adding===cat.id?`<div class="addrow"><input id="ad" placeholder="Что добавить"><button class="ok" data-add="${cat.id}">ок</button></div>`
      :`<button class="addbtn" data-open="${cat.id}">+ добавить</button>`;
    h+=`</section>`;
  }
  if(menuFor)h=`<div class="scrim" data-close="1"></div>`+h;
  if(moveFor)h+=`<button class="donebar" data-endmove="1">Готово — порядок сохранён</button>`;
  document.getElementById("app").innerHTML=h;
  document.body&&document.body.classList.toggle("dragmode",!!(moveFor||stepMove));
  const f=document.getElementById("rn")||document.getElementById("ad");
  if(f){f.focus();f.setSelectionRange(f.value.length,f.value.length)}
}

function rowHTML(it,cat,top){
  if(renaming===it.id&&!top)
    return `<div class="row"><input id="rn" value="${esc(it.text)}"><button class="ok" data-rename="${it.id}">ок</button></div>`;
  const dn=isDone(it),mv=moveFor===it.id,hit=pulse===it.id,m=dueMeta(it);
  return `<div class="row c-${it.cat} ${dn?"done":""} ${mv?"moving":""} ${hit?"hit":""}" data-id="${it.id}">
    <i class="fx"></i>
    <button class="dot ${dn?"on":""} ${hit?"pop":""}" data-toggle="${it.id}" aria-label="${esc(it.text)}"></button>
    <span class="txt ${dn?"done":""}" data-toggle="${it.id}">${esc(it.text)}</span>
    ${(it.steps||[]).length?`<span class="stepstag" data-task="${it.id}">шаги</span>`:""}
    ${m?`<span class="when ${m.cls}">${m.txt}</span>`:""}
    ${mv?`<span class="grip">≡</span>`:top?"":`<button class="more" data-menu="${it.id}">⋯</button>`}
    ${menuFor===it.id&&!top?menu(it,cat):""}</div>`;
}

const menu=(it,cat)=>`<div class="menu">
  <button data-rn="${it.id}">Переименовать</button>
  ${cat.daily?"":`<button data-due="${it.id}">${it.due?"Изменить срок":"Поставить срок"}</button>
  <button data-diff="${it.id}">Сложность: ${DIFF[it.diff||"mid"].name}</button>
  ${it.due?`<button data-ics="${it.id}">Напомнить в календаре</button>`:""}`}
  <button data-task="${it.id}">${(it.steps||[]).length?"Открыть шаги":"Разбить на шаги"}</button>
  <button data-mv="${it.id}">Переместить</button>
  <hr><button data-del="${it.id}" style="color:var(--red)">Удалить</button></div>`;

function applyDue(){
  const it=S.items.find(x=>x.id===dueFor); if(!it)return false;
  const dd=document.getElementById("dd"), dw=document.getElementById("dw"), dr=document.getElementById("dr");
  if(!dd)return false;
  if(dd.value){it.due=dd.value; it.warn=+(dw?dw.value:3); it.rep=(dr?dr.value:"0")==="1"}
  else {delete it.due; delete it.warn; delete it.rep}
  store.save(); return true;
}
document.addEventListener("change",e=>{
  if(e.target&&e.target.dataset&&e.target.dataset.duefield&&dueFor){
    applyDue(); render(); return;      // дата нужна сразу, иначе календарь недоступен
  }
  if(e.target&&e.target.id==="bkpevery"){
    S.backupEvery=+e.target.value; delete S.backupHidden; store.save(); render();
  }
});
document.addEventListener("click",e=>{
  if(suppressClick){suppressClick=false;return}
  const a=k=>e.target.closest(`[data-${k}]`)?.dataset[k];
  if(settings&&bkpMsg&&!e.target.closest("[data-export]"))bkpMsg=null;
  if(a("close")){menuFor=null;return render()}
  if(a("gear")){settings=!settings;notes=false;return render()}
  if(a("notes")){notes=true;return render()}
  if(a("notesback")){notes=false;return render()}
  if(a("bkphide")){S.backupHidden=today();store.save();return render()}
  if(a("export")){bkpMsg=exportData();return render()}
  if(a("import")){
    const n=document.getElementById("backupnote");
    pickImport(t=>{const el=document.getElementById("backupnote"); (el||n).textContent=t}); return}
  if(a("vibtest")){
    const n=document.getElementById("vibnote");
    if(!navigator.vibrate){n.textContent="Браузер не поддерживает вибрацию.";return}
    const ok=navigator.vibrate(500);
    n.textContent=ok?"Пошли полсекунды непрерывной вибрации. Если тихо — Настройки телефона → Звуки и вибрация → Интенсивность вибрации → «Обратная связь при касании». При нуле веб-вибрация молчит."
                   :"Система отклонила вызов — вибрация выключена на уровне телефона.";
    return}
  const sw=a("t"); if(sw){
    if(sw==="vol")S.vol=S.vol>1?1:1.8; else S[sw]=!S[sw];
    if(sw==="snd"||sw==="vol")tone([659.25,824,988.9],.36,.3*S.vol,.055);
    else if(sw==="vib"&&S.vib)buzz(35);
    store.save();return render()}
  const tg=a("toggle"); if(tg&&!moveFor)return toggle(tg);
  const m=a("menu"); if(m){menuFor=menuFor===m?null:m;return render()}
  const rn=a("rn"); if(rn){renaming=rn;menuFor=null;return render()}
  const du=a("due"); if(du){dueFor=du;menuFor=null;return render()}
  const df=a("diff"); if(df){diffFor=df;menuFor=null;return render()}
  const tk=a("task"); if(tk){taskFor=tk;taskEdit=!stepsOf(S.items.find(x=>x.id===tk)||{}).length;
    menuFor=null;return render()}
  if(a("taskback")){taskFor=null;taskEdit=false;return render()}
  if(a("taskedit")){taskEdit=!taskEdit;stepAdding=false;stepMenu=null;stepMove=null;return render()}
  const sTog=a("step"); if(sTog)return toggleStep(sTog);
  const tc=a("taskclose"); if(tc){taskFor=null;taskEdit=false;render();return toggle(tc)}
  if(a("stepopen")){stepAdding=true;stepMenu=null;return render()}
  if(a("stepadd")){
    const inp=document.getElementById("stepin"); const v=inp?inp.value.trim():"";
    if(!v){stepAdding=false;return render()}
    const it=S.items.find(x=>x.id===taskFor); if(!it)return;
    it.steps=stepsOf(it).concat({id:uid(),text:v}); store.save(); return render()}
  const sun=a("stepundo"); if(sun){
    const it=S.items.find(x=>x.id===taskFor);
    const st=stepsOf(it).find(x=>x.id===sun);
    if(st){st.done=false;store.save()} return render()}
  const smn=a("stepmenu"); if(smn){stepMenu=stepMenu===smn?null:smn;return render()}
  const smv=a("stepmv"); if(smv){stepMove=smv;stepMenu=null;stepAdding=false;return render()}
  if(a("stependmove")){stepMove=null;return render()}
  const sDel=a("stepdel"); if(sDel){const it=S.items.find(x=>x.id===taskFor);
    it.steps=stepsOf(it).filter(x=>x.id!==sDel); stepMenu=null; store.save(); return render()}
  
  const ics=a("ics"); if(ics){exportICS(ics);menuFor=null;return render()}
  const sf=a("setdiff"); if(sf){const[i,k]=sf.split("|");
    const it=S.items.find(x=>x.id===i); it.diff=k; store.save();return render()}
  if(a("diffback")){diffFor=null;return render()}
  const sd=a("savedue"); if(sd){const it=S.items.find(x=>x.id===sd);
    const v=document.getElementById("dd").value;
    if(v){it.due=v;it.warn=+document.getElementById("dw").value;
          it.rep=document.getElementById("dr").value==="1"}else{delete it.due;delete it.rep}
    dueFor=null;store.save();return render()}
  if(a("duesave")){applyDue();dueFor=null;return render()}
  if(a("dueback")){applyDue();dueFor=null;return render()}
  const cd=a("cleardue"); if(cd){const it=S.items.find(x=>x.id===cd);
    delete it.due;delete it.warn;delete it.rep;dueFor=null;store.save();return render()}
  const mv=a("mv"); if(mv){moveFor=mv;menuFor=null;return render()}
  if(a("endmove")){moveFor=null;return render()}
  const to=a("to"); if(to){const[i,c]=to.split("|");const it=S.items.find(x=>x.id===i);
    it.cat=c;it.done=false;delete it.doneAt;
    if(CATS.find(x=>x.id===c).daily){delete it.due;delete it.warn}
    menuFor=null;store.save();return render()}
  const del=a("del"); if(del){S.items=S.items.filter(x=>x.id!==del);
    for(const k in S.log)S.log[k]=S.log[k].filter(x=>x!==del);menuFor=null;store.save();return render()}
  const sv=a("rename"); if(sv){const v=document.getElementById("rn").value.trim();
    if(v)S.items.find(x=>x.id===sv).text=v;renaming=null;store.save();return render()}
  const op=a("open"); if(op){adding=op;return render()}
  const ad=a("add"); if(ad){const v=document.getElementById("ad").value.trim();
    if(v)S.items.push({id:uid(),cat:ad,text:v});adding=null;store.save();return render()}
});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;
  if(document.getElementById("stepin"))document.querySelector("[data-stepadd]")?.click();
  else if(document.getElementById("rn"))document.querySelector("[data-rename]")?.click();
  else if(document.getElementById("ad"))document.querySelector("[data-add]")?.click()});

let drag=null, holdTimer=null, holdStart=null, suppressClick=false;
document.addEventListener("pointerdown",e=>{
  if(taskFor||settings||dueFor||diffFor||moveFor||menuFor)return;
  const row=e.target.closest(".row[data-id]"); if(!row)return;
  if(e.target.closest("button")&&!e.target.closest(".txt"))return;
  holdStart={x:e.clientX,y:e.clientY};
  holdTimer=setTimeout(()=>{
    holdTimer=null; suppressClick=true;
    const it=S.items.find(x=>x.id===row.dataset.id);
    if(!it)return;
    buzz(20);
    taskFor=it.id; taskEdit=!stepsOf(it).length; render();
  },480);
});
function cancelHold(e){
  if(!holdTimer)return;
  if(e&&holdStart&&Math.abs(e.clientY-holdStart.y)<12&&Math.abs(e.clientX-holdStart.x)<12&&e.type!=="pointerup")return;
  clearTimeout(holdTimer); holdTimer=null;
}
document.addEventListener("pointermove",cancelHold);
document.addEventListener("pointerup",()=>{if(holdTimer){clearTimeout(holdTimer);holdTimer=null}});
document.addEventListener("pointercancel",()=>{if(holdTimer){clearTimeout(holdTimer);holdTimer=null}});

function syncFromDOM(){                     // собираем порядок и категории из DOM
  const seen=new Set(), next=[];
  document.querySelectorAll(".list").forEach(list=>{
    const cat=list.dataset.cat, daily=CATS.find(c=>c.id===cat).daily;
    list.querySelectorAll(".row").forEach(r=>{
      const it=S.items.find(x=>x.id===r.dataset.id); if(!it||seen.has(it.id))return;
      if(it.cat!==cat){                       // сменил полку
        it.cat=cat; it.done=false; delete it.doneAt;
        if(daily){delete it.due;delete it.warn}
      }
      seen.add(it.id); next.push(it);
    });
  });
  for(const it of S.items)if(!seen.has(it.id))next.push(it);   // скрытые не теряем
  S.items=next;
}
function startDrag(e){
  const active=moveFor||stepMove;
  if(!active||drag)return;
  const row=e.target.closest(".row"); if(!row||row.dataset.id!==active)return;
  e.preventDefault();row.classList.add("lifting");
  drag={row,startY:e.clientY,list:row.parentElement};
  try{row.setPointerCapture&&row.setPointerCapture(e.pointerId)}catch(err){}
}
document.addEventListener("pointerdown",startDrag,{passive:false});
document.addEventListener("pointermove",e=>{
  if(!drag)return; e.preventDefault();
  drag.row.style.transform=`translateY(${e.clientY-drag.startY}px)`;
  const r=drag.row.getBoundingClientRect(),mid=r.top+r.height/2;

  // палец над другим списком — переносим строку туда
  drag.row.style.pointerEvents="none";
  const under=document.elementFromPoint(e.clientX,Math.max(2,Math.min(innerHeight-2,e.clientY)));
  drag.row.style.pointerEvents="";
  const list=under&&under.closest(".list");
  if(list&&list!==drag.list){
    const rows=[...list.querySelectorAll(".row")];
    const after=rows.find(x=>{const b=x.getBoundingClientRect();return mid<b.top+b.height/2});
    after?list.insertBefore(drag.row,after):list.appendChild(drag.row);
    drag.list=list; drag.startY=e.clientY;
    drag.row.style.transform="translateY(0px)";
    return;
  }

  const prev=drag.row.previousElementSibling,next=drag.row.nextElementSibling;
  let swapped=false;
  if(prev&&prev.classList.contains("row")){
    const p=prev.getBoundingClientRect();
    if(mid<p.top+p.height/2){
      drag.list.insertBefore(drag.row,prev);drag.startY-=p.height+7;
      drag.row.style.transform=`translateY(${e.clientY-drag.startY}px)`;swapped=true;
    }
  }
  if(!swapped&&next&&next.classList.contains("row")){
    const n=next.getBoundingClientRect();
    if(mid>n.top+n.height/2){
      drag.list.insertBefore(next,drag.row);drag.startY+=n.height+7;
      drag.row.style.transform=`translateY(${e.clientY-drag.startY}px)`;
    }
  }
  if(e.clientY<90)scrollBy(0,-9);else if(e.clientY>innerHeight-90)scrollBy(0,9)},{passive:false});
function endDrag(){
  if(!drag)return;
  drag.row.style.transform="";drag.row.classList.remove("lifting");
  if(drag.list&&drag.list.dataset.steps){
    const it=S.items.find(x=>x.id===taskFor);
    if(it){const order=[...drag.list.querySelectorAll(".row")].map(r=>r.dataset.id);
      const map=Object.fromEntries(stepsOf(it).map(x=>[x.id,x]));
      it.steps=order.map(id=>map[id]).filter(Boolean)
        .concat(stepsOf(it).filter(x=>!order.includes(x.id)));}
  }else syncFromDOM();
  drag=null;store.save();render();
}
document.addEventListener("pointerup",endDrag);
document.addEventListener("pointercancel",endDrag);
document.addEventListener("touchend",endDrag);
document.addEventListener("touchcancel",endDrag);

/* первое касание разблокирует звук в Chrome */
addEventListener("pointerdown",()=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();
  if(ac.state==="suspended")ac.resume()}catch(e){}},{once:true});

store.load().then(d=>{if(d&&d.items)S={...S,...d};if(!S.days)S.days={};migrate();sweep();render()});
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
