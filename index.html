<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17131f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Рутина">
<title>Рутина</title>
<link rel="manifest" href='data:application/json,{"name":"Рутина","short_name":"Рутина","start_url":".","display":"standalone","background_color":"%2317131f","theme_color":"%2317131f","icons":[{"src":"data:image/svg%2Bxml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 192 192%22%3E%3Crect width=%22192%22 height=%22192%22 rx=%2242%22 fill=%22%2317131f%22/%3E%3Ccircle cx=%2296%22 cy=%2296%22 r=%2244%22 fill=%22none%22 stroke=%22%23e0a458%22 stroke-width=%2212%22/%3E%3C/svg%3E","sizes":"192x192","type":"image/svg+xml"}]}'>

<style>
  :root{
    --bg:#17131f; --surf:#221c2d; --surf2:#2c2439; --line:#332b42;
    --text:#eae4dd; --dim:#8d84a0; --amber:#e0a458; --sage:#7fa88b; --red:#c97b7b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:max(24px,env(safe-area-inset-top)) 18px 80px;
    max-width:560px; margin:0 auto; overscroll-behavior-y:contain;
  }
  h1{font:500 15px/1 system-ui; letter-spacing:.14em; color:var(--dim); margin:0}
  h2{font:400 20px Georgia,serif; margin:0 0 2px}
  .sub{color:var(--dim); font-size:12px; margin-bottom:10px}
  .count{font:300 68px/.8 Georgia,serif}
  .bars{display:flex; gap:4px; margin-top:16px}
  .bar{height:6px; flex:1; border-radius:3px; background:var(--line); transition:background .35s,box-shadow .35s}
  .bar.on{background:var(--amber); box-shadow:0 0 12px #e0a45866}
  .week{display:flex; gap:6px; margin-top:22px; align-items:flex-end}
  .wk{flex:1; text-align:center}
  .wk i{display:block; border-radius:2px; background:var(--line)}
  .wk span{font-size:10px; color:var(--dim); display:block; margin-top:5px}
  section{margin-top:34px}
  .row{
    position:relative; display:flex; align-items:center; gap:12px;
    background:var(--surf); border:1px solid var(--line); border-radius:10px;
    padding:14px; margin-bottom:7px; transition:transform .16s,border-color .2s,background .2s;
  }
  .row.done{border-color:transparent}
  .row.moving{border-color:var(--amber); background:var(--surf2); box-shadow:0 8px 26px #0009; z-index:40; touch-action:none}
  .row.lifting{transition:none; z-index:50}
  .dot{
    width:24px;height:24px;flex:0 0 auto;border-radius:50%;
    border:2px solid var(--line); background:none; padding:0; cursor:pointer;
  }
  .dot.on{background:var(--amber); border-color:var(--amber)}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
  .pop{animation:pop .5s ease}
  .txt{flex:1; font-size:16px; cursor:pointer; word-break:break-word}
  .txt.done{color:var(--dim); text-decoration:line-through}
  .more{background:none;border:none;color:var(--dim);font-size:19px;line-height:1;padding:6px 2px;cursor:pointer}
  .grip{color:var(--amber); font-size:19px; padding:6px 4px; touch-action:none; cursor:grab; user-select:none}
  .menu{
    position:absolute; top:calc(100% + 6px); right:6px; z-index:60;
    background:var(--surf2); border:1px solid var(--line); border-radius:12px;
    padding:6px; min-width:212px; box-shadow:0 10px 30px #000a;
  }
  .menu button{display:block;width:100%;text-align:left;background:none;border:none;
    color:var(--text);font-size:15px;padding:11px 12px;border-radius:8px;cursor:pointer}
  .menu .lab{color:var(--dim);font-size:11px;padding:4px 12px 6px}
  .menu hr{border:none;border-top:1px solid var(--line);margin:5px 8px}
  .addbtn{background:none;border:1px dashed var(--line);border-radius:10px;padding:11px 14px;
    color:var(--dim);font-size:14px;width:100%;text-align:left;cursor:pointer;margin-top:4px}
  .addrow{display:flex;gap:8px;margin-top:8px}
  input{flex:1;background:var(--surf);border:1px solid var(--line);border-radius:10px;
    padding:13px 14px;color:var(--text);font-size:16px}
  .ok{background:var(--amber);border:none;border-radius:10px;padding:0 18px;color:var(--bg);font-size:15px;cursor:pointer}
  .empty{color:var(--dim);font-size:13px;padding:6px 0}
  .closed{color:var(--dim);font-size:12px;margin-top:6px;cursor:pointer}
  .closed div{margin-top:7px;display:flex;gap:10px;align-items:center}
  .closed s{color:var(--dim)}
  .closed b{color:var(--sage);font-weight:400;cursor:pointer}
  .scrim{position:fixed;inset:0;z-index:55}
  .donebar{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--amber);color:var(--bg);
    border:none;width:100%;padding:18px;font-size:16px;cursor:pointer}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>

<script>
const CATS=[
 {id:"routine",title:"Рутина",sub:"каждый день",daily:true},
 {id:"wish",title:"Желательное",sub:"хотелось бы, но не обязан",daily:true},
 {id:"needed",title:"Нужно сделать",sub:"без даты",daily:false},
 {id:"maybe",title:"Можно сделать",sub:"если захочется",daily:false}];

const KEY="routine_v1";
let S={items:[],log:{}};
let menuFor=null, moveFor=null, renaming=null, adding=null, openClosed={}, pulse=null;

const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const lab=iso=>["вс","пн","вт","ср","чт","пт","сб"][new Date(iso+"T12:00").getDay()];
const days=n=>{const o=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);
  o.push(new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10))}return o};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* хранилище: в чате — window.storage, в сохранённом файле — localStorage */
const store={
  async load(){
    try{ if(window.storage){const r=await window.storage.get(KEY);return JSON.parse(r.value)} }catch(e){}
    try{ const v=localStorage.getItem(KEY); if(v) return JSON.parse(v) }catch(e){}
    return null;
  },
  save(){
    const d=JSON.stringify(S);
    try{ if(window.storage){window.storage.set(KEY,d).catch(()=>{})} }catch(e){}
    try{ localStorage.setItem(KEY,d) }catch(e){}
  }
};

const byCat=c=>S.items.filter(i=>i.cat===c);
const doneToday=()=>S.log[today()]||[];
const isDone=it=>CATS.find(c=>c.id===it.cat).daily?doneToday().includes(it.id):!!it.done;

function toggle(id){
  const it=S.items.find(x=>x.id===id); if(!it||moveFor)return;
  const cat=CATS.find(c=>c.id===it.cat), t=today();
  if(cat.daily){
    const d=doneToday(), has=d.includes(id);
    S.log[t]=has?d.filter(x=>x!==id):[...d,id];
    if(!has){pulse=id;setTimeout(()=>{pulse=null;render()},600)}
  }else{
    if(!it.done){pulse=id;render();setTimeout(()=>{it.done=true;pulse=null;store.save();render()},420);return}
    it.done=false;
  }
  store.save();render();
}

function render(){
  const t=today(), d=doneToday(), routine=byCat("routine");
  let h=`<div style="display:flex;align-items:baseline;justify-content:space-between">
    <h1>${lab(t)}</h1></div>
    <div style="display:flex;align-items:flex-end;gap:10px;margin-top:14px">
      <div class="count">${d.length}</div>
      <div style="color:var(--dim);font-size:13px;padding-bottom:6px">${d.length?"отмечено сегодня":"пока ничего"}</div>
    </div>
    <div class="bars">${routine.map(r=>`<div class="bar ${d.includes(r.id)?"on":""}"></div>`).join("")}</div>
    <div style="color:var(--dim);font-size:12px;margin-top:8px">рутина ${routine.filter(r=>d.includes(r.id)).length} из ${routine.length}</div>
    <div class="week">${days(7).map(x=>{const n=(S.log[x]||[]).length;
      return `<div class="wk"><i style="height:${Math.min(28,4+n*5)}px;background:${x===t?"var(--amber)":n?"var(--sage)":"var(--line)"}"></i><span>${lab(x)}</span></div>`}).join("")}</div>`;

  for(const cat of CATS){
    const list=byCat(cat.id);
    const vis=cat.daily?list:list.filter(i=>!i.done);
    const bur=cat.daily?[]:list.filter(i=>i.done);
    h+=`<section><h2>${cat.title}</h2><div class="sub">${cat.sub}</div><div class="list" data-cat="${cat.id}">`;
    if(!vis.length)h+=`<div class="empty">Пусто. Добавь ниже.</div>`;
    for(const it of vis){
      const dn=isDone(it), mv=moveFor===it.id;
      if(renaming===it.id){
        h+=`<div class="row"><input id="rn" value="${esc(it.text)}"><button class="ok" data-rename="${it.id}">ок</button></div>`;continue;
      }
      h+=`<div class="row ${dn?"done":""} ${mv?"moving":""}" data-id="${it.id}">
        <button class="dot ${dn?"on":""} ${pulse===it.id?"pop":""}" data-toggle="${it.id}" aria-label="${esc(it.text)}"></button>
        <span class="txt ${dn?"done":""}" data-toggle="${it.id}">${esc(it.text)}</span>
        ${mv?`<span class="grip">≡</span>`:`<button class="more" data-menu="${it.id}">⋯</button>`}
        ${menuFor===it.id?menu(it,cat):""}
      </div>`;
    }
    h+=`</div>`;
    if(bur.length){
      h+=`<div class="closed"><span data-closed="${cat.id}">закрыто: ${bur.length} ${openClosed[cat.id]?"▴":"▾"}</span>`;
      if(openClosed[cat.id])for(const b of bur)h+=`<div><s>${esc(b.text)}</s><b data-toggle="${b.id}">вернуть</b></div>`;
      h+=`</div>`;
    }
    h+= adding===cat.id
      ? `<div class="addrow"><input id="ad" placeholder="Что добавить"><button class="ok" data-add="${cat.id}">ок</button></div>`
      : `<button class="addbtn" data-open="${cat.id}">+ добавить</button>`;
    h+=`</section>`;
  }
  if(menuFor)h=`<div class="scrim" data-close="1"></div>`+h;
  if(moveFor)h+=`<button class="donebar" data-endmove="1">Готово — порядок сохранён</button>`;
  document.getElementById("app").innerHTML=h;
  const f=document.getElementById("rn")||document.getElementById("ad");
  if(f){f.focus();f.setSelectionRange(f.value.length,f.value.length)}
}

function menu(it,cat){
  return `<div class="menu">
    <button data-rn="${it.id}">Переименовать</button>
    <button data-mv="${it.id}">Переместить</button>
    <hr><div class="lab">Перенести в</div>
    ${CATS.filter(c=>c.id!==cat.id).map(c=>`<button data-to="${it.id}|${c.id}">${c.title}</button>`).join("")}
    <hr><button data-del="${it.id}" style="color:var(--red)">Удалить</button></div>`;
}

document.addEventListener("click",e=>{
  const a=k=>e.target.closest(`[data-${k}]`)?.dataset[k];
  if(a("close")){menuFor=null;return render()}
  const tg=a("toggle"); if(tg&&!moveFor)return toggle(tg);
  const m=a("menu"); if(m){menuFor=menuFor===m?null:m;return render()}
  const rn=a("rn"); if(rn){renaming=rn;menuFor=null;return render()}
  const mv=a("mv"); if(mv){moveFor=mv;menuFor=null;return render()}
  if(a("endmove")){moveFor=null;return render()}
  const to=a("to"); if(to){const[i,c]=to.split("|");const it=S.items.find(x=>x.id===i);
    it.cat=c;it.done=false;menuFor=null;store.save();return render()}
  const del=a("del"); if(del){S.items=S.items.filter(x=>x.id!==del);
    for(const k in S.log)S.log[k]=S.log[k].filter(x=>x!==del);
    menuFor=null;store.save();return render()}
  const sv=a("rename"); if(sv){const v=document.getElementById("rn").value.trim();
    if(v)S.items.find(x=>x.id===sv).text=v; renaming=null;store.save();return render()}
  const op=a("open"); if(op){adding=op;return render()}
  const ad=a("add"); if(ad){const v=document.getElementById("ad").value.trim();
    if(v)S.items.push({id:uid(),cat:ad,text:v}); adding=null;store.save();return render()}
  const cl=a("closed"); if(cl){openClosed[cl]=!openClosed[cl];return render()}
});

document.addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  if(document.getElementById("rn"))document.querySelector("[data-rename]")?.click();
  else if(document.getElementById("ad"))document.querySelector("[data-add]")?.click();
});

/* --- перетаскивание пальцем --- */
let drag=null;
document.addEventListener("pointerdown",e=>{
  if(!moveFor)return;
  const row=e.target.closest(".row");
  if(!row||row.dataset.id!==moveFor)return;
  e.preventDefault();
  row.classList.add("lifting");
  drag={row,startY:e.clientY,list:row.parentElement};
  row.setPointerCapture?.(e.pointerId);
});
document.addEventListener("pointermove",e=>{
  if(!drag)return;
  e.preventDefault();
  let dy=e.clientY-drag.startY;
  drag.row.style.transform=`translateY(${dy}px)`;
  const r=drag.row.getBoundingClientRect(), mid=r.top+r.height/2;
  const prev=drag.row.previousElementSibling, next=drag.row.nextElementSibling;
  if(prev&&prev.classList.contains("row")){
    const p=prev.getBoundingClientRect();
    if(mid<p.top+p.height/2){drag.list.insertBefore(drag.row,prev);drag.startY-=p.height+7;
      drag.row.style.transform=`translateY(${e.clientY-drag.startY}px)`}
  }else if(next&&next.classList.contains("row")){
    const n=next.getBoundingClientRect();
    if(mid>n.top+n.height/2){drag.list.insertBefore(next,drag.row);drag.startY+=n.height+7;
      drag.row.style.transform=`translateY(${e.clientY-drag.startY}px)`}
  }
  if(e.clientY<90)scrollBy(0,-9); else if(e.clientY>innerHeight-90)scrollBy(0,9);
},{passive:false});
document.addEventListener("pointerup",()=>{
  if(!drag)return;
  drag.row.style.transform="";drag.row.classList.remove("lifting");
  const cat=drag.list.dataset.cat;
  const order=[...drag.list.querySelectorAll(".row")].map(r=>r.dataset.id);
  const map=Object.fromEntries(byCat(cat).map(i=>[i.id,i]));
  const sorted=order.map(id=>map[id]).filter(Boolean);
  const rest=byCat(cat).filter(i=>!order.includes(i.id));
  const q=[...sorted,...rest]; let k=0;
  S.items=S.items.map(i=>i.cat===cat?q[k++]:i);
  drag=null;store.save();
});

store.load().then(d=>{if(d&&d.items){S=d}render()});
</script>
