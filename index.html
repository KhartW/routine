<!doctype html><html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>P:F</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17131f">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="P:F">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{--bg:#17131f;--surf:#221c2d;--surf2:#2c2439;--line:#332b42;
    --text:#eae4dd;--dim:#8d84a0;--amber:#e0a458;--sage:#7fa88b;--red:#c97b7b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg)}
  body{margin:0;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:calc(18px + env(safe-area-inset-top)) 18px calc(90px + env(safe-area-inset-bottom));
    max-width:560px;margin:0 auto;overscroll-behavior-y:contain}
  h1{font:500 15px/1 system-ui;letter-spacing:.14em;color:var(--dim);margin:0}
  h2{font:400 20px Georgia,serif;margin:0 0 2px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:10px}
  .count{font:300 68px/.8 Georgia,serif;transition:color .3s}
  .gap{color:var(--dim);font-size:13px;padding-bottom:6px}
  .bars{display:flex;gap:4px;margin-top:16px}
  .bar{height:6px;flex:1;min-width:3px;border-radius:3px;background:var(--line);
    transition:background .4s,box-shadow .4s,transform .25s}
  .bar.on{background:var(--amber);box-shadow:0 0 12px #e0a45866}
  .bars.full .bar{background:#f3d29a;box-shadow:0 0 18px #f3d29a99}
  @keyframes wave{0%,100%{transform:scaleY(1)}50%{transform:scaleY(2.6)}}
  .bars.cheer .bar{animation:wave .5s ease}
  .week{display:flex;gap:6px;margin-top:20px;align-items:flex-end}
  .wk{flex:1;text-align:center}
  .wk i{display:block;border-radius:2px;background:var(--line);transition:height .4s}
  .wk span{font-size:10px;color:var(--dim);display:block;margin-top:5px}
  .lvl{margin-top:22px;display:flex;align-items:center;gap:10px}
  .lvlbar{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
  .lvlbar i{display:block;height:100%;background:var(--sage);transition:width .5s ease}
  .lvltext{font-size:11px;color:var(--dim);white-space:nowrap}
  section{margin-top:30px}
  .row{position:relative;display:flex;align-items:center;gap:12px;background:var(--surf);
    border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:7px;
    transition:transform .16s,border-color .2s,background .2s,opacity .3s;overflow:hidden}
  .row.done{border-color:transparent}
  .row.moving{border-color:var(--amber);background:var(--surf2);box-shadow:0 8px 26px #0009;touch-action:none;z-index:40}
  .row.lifting{transition:none;z-index:50}
  .row::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#e0a45800,#e0a45855,#e0a45800);
    transform:translateX(-100%);pointer-events:none}
  @keyframes sweep{to{transform:translateX(100%)}}
  .row.hit::after{animation:sweep .55s ease}
  .dot{width:24px;height:24px;flex:0 0 auto;border-radius:50%;border:2px solid var(--line);
    background:none;padding:0;cursor:pointer;position:relative}
  .dot.on{background:var(--amber);border-color:var(--amber)}
  @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.55)}100%{transform:scale(1)}}
  @keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
  .dot.pop{animation:pop .45s ease}
  .dot.pop::before{content:"";position:absolute;inset:-2px;border-radius:50%;
    border:2px solid var(--amber);animation:ring .55s ease-out forwards}
  .txt{flex:1;font-size:16px;cursor:pointer;word-break:break-word}
  .txt.done{color:var(--dim);text-decoration:line-through}
  .more{background:none;border:none;color:var(--dim);font-size:19px;line-height:1;padding:6px 2px;cursor:pointer}
  .grip{color:var(--amber);font-size:19px;padding:6px 4px;touch-action:none;cursor:grab;user-select:none}
  .menu{position:absolute;top:calc(100% + 6px);right:6px;z-index:60;background:var(--surf2);
    border:1px solid var(--line);border-radius:12px;padding:6px;min-width:212px;box-shadow:0 10px 30px #000a}
  .menu button{display:block;width:100%;text-align:left;background:none;border:none;
    color:var(--text);font-size:15px;padding:11px 12px;border-radius:8px;cursor:pointer}
  .menu .lab{color:var(--dim);font-size:11px;padding:4px 12px 6px}
  .menu hr{border:none;border-top:1px solid var(--line);margin:5px 8px}
  .addbtn{background:none;border:1px dashed var(--line);border-radius:10px;padding:11px 14px;
    color:var(--dim);font-size:14px;width:100%;text-align:left;cursor:pointer;margin-top:4px}
  .addrow{display:flex;gap:8px;margin-top:8px}
  input{flex:1;background:var(--surf);border:1px solid var(--line);border-radius:10px;
    padding:13px 14px;color:var(--text);font-size:16px}
  .ok{background:var(--amber);border:none;border-radius:10px;padding:0 18px;color:var(--bg);font-size:15px;cursor:pointer}
  .empty{color:var(--dim);font-size:13px;padding:6px 0}
  .closed{color:var(--dim);font-size:12px;margin-top:6px}
  .closed div{margin-top:7px;display:flex;gap:10px;align-items:center}
  .closed b{color:var(--sage);font-weight:400;cursor:pointer}
  .scrim{position:fixed;inset:0;z-index:55}
  .donebar{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--amber);color:var(--bg);
    border:none;width:100%;padding:18px calc(18px + env(safe-area-inset-bottom));font-size:16px;cursor:pointer}
  .gear{background:none;border:none;color:var(--dim);font-size:16px;cursor:pointer;padding:4px}
  .panel{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px}
  .panel label{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:7px 0}
  .sw{width:44px;height:26px;border-radius:14px;background:var(--line);border:none;position:relative;cursor:pointer;flex:0 0 auto}
  .sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:.2s}
  .sw.on{background:#4a3c2a}.sw.on i{left:21px;background:var(--amber)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"></div>
<script>
const CATS=[
 {id:"routine",title:"Рутина",sub:"каждый день",daily:true},
 {id:"wish",title:"Желательное",sub:"хотелось бы, но не обязан",daily:true},
 {id:"needed",title:"Нужно сделать",sub:"без даты",daily:false},
 {id:"maybe",title:"Можно сделать",sub:"если захочется",daily:false}];
const KEY="routine_v1", STEP=20;

let S={items:[],log:{},total:0,snd:true,vib:true};
let menuFor=null,moveFor=null,renaming=null,adding=null,openClosed={},pulse=null,cheer=false,settings=false;

const uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const lab=s=>["вс","пн","вт","ср","чт","пт","сб"][new Date(s+"T12:00").getDay()];
const days=n=>{const o=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);o.push(iso(d))}return o};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const store={
  async load(){
    try{if(window.storage){return JSON.parse((await window.storage.get(KEY)).value)}}catch(e){}
    try{const v=localStorage.getItem(KEY);if(v)return JSON.parse(v)}catch(e){}
    return null},
  save(){const d=JSON.stringify(S);
    try{if(window.storage)window.storage.set(KEY,d).catch(()=>{})}catch(e){}
    try{localStorage.setItem(KEY,d)}catch(e){}}
};

/* --- отклик --- */
let ac=null;
function tone(freqs,dur=.13,vol=.13){
  if(!S.snd)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended")ac.resume();
    freqs.forEach((f,i)=>{
      const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.075;
      o.type="sine";o.frequency.value=f;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.05);
    });
  }catch(e){}
}
const buzz=p=>{if(S.vib&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};

const byCat=c=>S.items.filter(i=>i.cat===c);
const doneToday=()=>S.log[today()]||[];
const isDone=it=>CATS.find(c=>c.id===it.cat).daily?doneToday().includes(it.id):!!it.done;

function toggle(id){
  const it=S.items.find(x=>x.id===id); if(!it||moveFor)return;
  const cat=CATS.find(c=>c.id===it.cat),t=today();
  const routine=byCat("routine");
  if(cat.daily){
    const d=doneToday(),has=d.includes(id);
    S.log[t]=has?d.filter(x=>x!==id):[...d,id];
    if(!has)reward(id,routine);
  }else{
    if(!it.done){reward(id,routine);render();
      setTimeout(()=>{it.done=true;pulse=null;store.save();render()},520);return}
    it.done=false;
  }
  store.save();render();
}

function reward(id,routine){
  pulse=id; S.total++;
  const left=routine.filter(r=>!doneToday().includes(r.id)).length;
  const lvlUp=S.total%STEP===0;
  if(routine.length&&left===0){cheer=true;tone([523,659,784],.22,.11);buzz([18,60,28])}
  else if(lvlUp){tone([494,740],.2,.11);buzz([14,50,22])}
  else{tone([660],.11);buzz(12)}
  setTimeout(()=>{pulse=null;cheer=false;render()},650);
}

function render(){
  const t=today(),d=doneToday(),routine=byCat("routine");
  const doneR=routine.filter(r=>d.includes(r.id)).length,left=routine.length-doneR;
  const lvl=Math.floor(S.total/STEP)+1,into=S.total%STEP;
  let h=`<div style="display:flex;align-items:center;justify-content:space-between">
    <h1>${lab(t)}</h1><button class="gear" data-gear="1">${settings?"✕":"⚙"}</button></div>`;
  if(settings)h+=`<div class="panel">
      <label>Звук отметки<button class="sw ${S.snd?"on":""}" data-t="snd"><i></i></button></label>
      <label>Вибрация<button class="sw ${S.vib?"on":""}" data-t="vib"><i></i></button></label>
      <div style="color:var(--dim);font-size:11px;margin-top:6px">Всего отметок: ${S.total}</div></div>`;
  h+=`<div style="display:flex;align-items:flex-end;gap:10px;margin-top:14px">
      <div class="count">${d.length}</div>
      <div class="gap">${routine.length===0?"добавь первый пункт":left>0?`ещё ${left} до полного дня`:"день закрыт"}</div></div>
    <div class="bars ${left===0&&routine.length?"full":""} ${cheer?"cheer":""}">
      ${routine.map(r=>`<div class="bar ${d.includes(r.id)?"on":""}"></div>`).join("")}</div>
    <div class="week">${days(7).map(x=>{const n=(S.log[x]||[]).length;
      return `<div class="wk"><i style="height:${Math.min(28,4+n*5)}px;background:${x===t?"var(--amber)":n?"var(--sage)":"var(--line)"}"></i><span>${lab(x)}</span></div>`}).join("")}</div>
    <div class="lvl"><div class="lvlbar"><i style="width:${into/STEP*100}%"></i></div>
      <div class="lvltext">ур. ${lvl} · ещё ${STEP-into}</div></div>`;

  for(const cat of CATS){
    const list=byCat(cat.id),vis=cat.daily?list:list.filter(i=>!i.done),bur=cat.daily?[]:list.filter(i=>i.done);
    h+=`<section><h2>${cat.title}</h2><div class="sub">${cat.sub}</div><div class="list" data-cat="${cat.id}">`;
    if(!vis.length)h+=`<div class="empty">Пусто. Добавь ниже.</div>`;
    for(const it of vis){
      if(renaming===it.id){h+=`<div class="row"><input id="rn" value="${esc(it.text)}"><button class="ok" data-rename="${it.id}">ок</button></div>`;continue}
      const dn=isDone(it),mv=moveFor===it.id,hit=pulse===it.id;
      h+=`<div class="row ${dn?"done":""} ${mv?"moving":""} ${hit?"hit":""}" data-id="${it.id}">
        <button class="dot ${dn?"on":""} ${hit?"pop":""}" data-toggle="${it.id}" aria-label="${esc(it.text)}"></button>
        <span class="txt ${dn?"done":""}" data-toggle="${it.id}">${esc(it.text)}</span>
        ${mv?`<span class="grip">≡</span>`:`<button class="more" data-menu="${it.id}">⋯</button>`}
        ${menuFor===it.id?menu(it,cat):""}</div>`;
    }
    h+=`</div>`;
    if(bur.length){
      h+=`<div class="closed"><span data-closed="${cat.id}">закрыто: ${bur.length} ${openClosed[cat.id]?"▴":"▾"}</span>`;
      if(openClosed[cat.id])for(const b of bur)h+=`<div><s>${esc(b.text)}</s><b data-toggle="${b.id}">вернуть</b></div>`;
      h+=`</div>`;
    }
    h+=adding===cat.id?`<div class="addrow"><input id="ad" placeholder="Что добавить"><button class="ok" data-add="${cat.id}">ок</button></div>`
      :`<button class="addbtn" data-open="${cat.id}">+ добавить</button>`;
    h+=`</section>`;
  }
  if(menuFor)h=`<div class="scrim" data-close="1"></div>`+h;
  if(moveFor)h+=`<button class="donebar" data-endmove="1">Готово — порядок сохранён</button>`;
  document.getElementById("app").innerHTML=h;
  const f=document.getElementById("rn")||document.getElementById("ad");
  if(f){f.focus();f.setSelectionRange(f.value.length,f.value.length)}
}

const menu=(it,cat)=>`<div class="menu">
  <button data-rn="${it.id}">Переименовать</button>
  <button data-mv="${it.id}">Переместить</button><hr><div class="lab">Перенести в</div>
  ${CATS.filter(c=>c.id!==cat.id).map(c=>`<button data-to="${it.id}|${c.id}">${c.title}</button>`).join("")}
  <hr><button data-del="${it.id}" style="color:var(--red)">Удалить</button></div>`;

document.addEventListener("click",e=>{
  const a=k=>e.target.closest(`[data-${k}]`)?.dataset[k];
  if(a("close")){menuFor=null;return render()}
  if(a("gear")){settings=!settings;return render()}
  const sw=a("t"); if(sw){S[sw]=!S[sw];if(sw==="snd"&&S.snd)tone([660],.1);if(sw==="vib"&&S.vib)buzz(12);store.save();return render()}
  const tg=a("toggle"); if(tg&&!moveFor)return toggle(tg);
  const m=a("menu"); if(m){menuFor=menuFor===m?null:m;return render()}
  const rn=a("rn"); if(rn){renaming=rn;menuFor=null;return render()}
  const mv=a("mv"); if(mv){moveFor=mv;menuFor=null;return render()}
  if(a("endmove")){moveFor=null;return render()}
  const to=a("to"); if(to){const[i,c]=to.split("|");const it=S.items.find(x=>x.id===i);
    it.cat=c;it.done=false;menuFor=null;store.save();return render()}
  const del=a("del"); if(del){S.items=S.items.filter(x=>x.id!==del);
    for(const k in S.log)S.log[k]=S.log[k].filter(x=>x!==del);menuFor=null;store.save();return render()}
  const sv=a("rename"); if(sv){const v=document.getElementById("rn").value.trim();
    if(v)S.items.find(x=>x.id===sv).text=v;renaming=null;store.save();return render()}
  const op=a("open"); if(op){adding=op;return render()}
  const ad=a("add"); if(ad){const v=document.getElementById("ad").value.trim();
    if(v)S.items.push({id:uid(),cat:ad,text:v});adding=null;store.save();return render()}
  const cl=a("closed"); if(cl){openClosed[cl]=!openClosed[cl];return render()}
});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;
  if(document.getElementById("rn"))document.querySelector("[data-rename]")?.click();
  else if(document.getElementById("ad"))document.querySelector("[data-add]")?.click()});

let drag=null;
document.addEventListener("pointerdown",e=>{
  if(!moveFor)return;
  const row=e.target.closest(".row"); if(!row||row.dataset.id!==moveFor)return;
  e.preventDefault();row.classList.add("lifting");
  drag={row,startY:e.clientY,list:row.parentElement};
  row.setPointerCapture?.(e.pointerId)});
document.addEventListener("pointermove",e=>{
  if(!drag)return; e.preventDefault();
  drag.row.style.transform=`translateY(${e.clientY-drag.startY}px)`;
  const r=drag.row.getBoundingClientRect(),mid=r.top+r.height/2;
  const prev=drag.row.previousElementSibling,next=drag.row.nextElementSibling;
  if(prev&&prev.classList.contains("row")){const p=prev.getBoundingClientRect();
    if(mid<p.top+p.height/2){drag.list.insertBefore(drag.row,prev);drag.startY-=p.height+7;
      drag.row.style.transform=`translateY(${e.clientY-drag.startY}px)`}}
  else if(next&&next.classList.contains("row")){const n=next.getBoundingClientRect();
    if(mid>n.top+n.height/2){drag.list.insertBefore(next,drag.row);drag.startY+=n.height+7;
      drag.row.style.transform=`translateY(${e.clientY-drag.startY}px)`}}
  if(e.clientY<90)scrollBy(0,-9);else if(e.clientY>innerHeight-90)scrollBy(0,9)},{passive:false});
document.addEventListener("pointerup",()=>{
  if(!drag)return;
  drag.row.style.transform="";drag.row.classList.remove("lifting");
  const cat=drag.list.dataset.cat,order=[...drag.list.querySelectorAll(".row")].map(r=>r.dataset.id);
  const map=Object.fromEntries(byCat(cat).map(i=>[i.id,i]));
  const q=[...order.map(id=>map[id]).filter(Boolean),...byCat(cat).filter(i=>!order.includes(i.id))];
  let k=0;S.items=S.items.map(i=>i.cat===cat?q[k++]:i);
  drag=null;store.save()});

store.load().then(d=>{if(d&&d.items)S={...S,...d};render()});
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
